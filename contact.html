    <link rel="stylesheet" href="site.css?v=2">
    <style>
        .center-head { text-align:center; }
        .center-head .crumbs, .center-head .kicker { justify-content:center; }
        .center-head .page-lead { margin-left:auto; margin-right:auto; }
        .form-card { max-width:560px; margin:0 auto; padding:30px; border-radius:var(--r-panel); }
        .form-card .field:last-of-type { margin-bottom:22px; }
        .field > label i { color:var(--lagoon); width:1.2em; margin-right:4px; }
        .form-card .field > label { display:flex; align-items:center; gap:6px; min-height:24px; line-height:1.3; }
        .field > label i { margin-right:0; }
        .req { color:var(--err); font-weight:700; }
        .opt { font-weight:400; color:var(--soft); font-size:.82rem; }
        .send-btn { width:100%; }
        .contact-alt { max-width:560px; margin:22px auto 0; display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
        .contact-alt a { display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:8px 18px; border:1.5px solid var(--line); border-radius:999px; background:var(--paper); font-weight:600; font-size:.92rem; color:var(--ink); transition:border-color .2s, transform .2s; max-width:100%; overflow-wrap:anywhere; }
        .contact-alt a:hover { border-color:var(--ink); transform:translateY(-3px); }
        .contact-alt i { color:var(--lagoon); }
        @media (max-width:480px) { .form-card { padding:22px 18px; } }
    </style>
</head>
<body class="v2">
    <a class="skip" href="#main">Skip to content</a>
    <main id="main">
        <header class="page-head center-head">
            <div class="wrap">
                <ol class="crumbs"><li><a href="index.html">Home</a></li><li aria-hidden="true">/</li><li aria-current="page">Contact</li></ol>
                <span class="kicker">Get in touch</span>
                <h1 class="page-title">Say hello</h1>
                <p class="page-lead">Have a question or want to connect? I'll reply as soon as I can.</p>
            </div>
        </header>

        <div class="wrap">
            <div class="panel form-card">
                <form action="https://formsubmit.co/allmunanabdullah@gmail.com" method="POST">

                    <!-- FormSubmit config -->
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_subject" value="New message from munan07.github.io!">
                    <input type="hidden" name="_template" value="table">
                    <input type="hidden" name="_next" value="https://abamunan.github.io/contactRep.html">

                    <div class="form-row">
                        <div class="field">
                            <label for="name"><i class="fas fa-user" aria-hidden="true"></i> Name <span class="req" aria-hidden="true">*</span></label>
                            <input type="text" id="name" name="name" class="input" placeholder="Your name" required>
                        </div>
                        <div class="field">
                            <label for="email"><i class="fas fa-envelope" aria-hidden="true"></i> Email <span class="opt">(optional)</span></label>
                            <input type="email" id="email" name="email" class="input" placeholder="you@example.com">
                        </div>
                    </div>

                    <div class="field">
                        <label for="phone"><i class="fas fa-phone" aria-hidden="true"></i> Phone <span class="opt">(optional)</span></label>
                        <input type="tel" id="phone" name="phone" class="input" placeholder="+880 1XXX-XXXXXX">
                    </div>

                    <div class="field">
                        <label for="message"><i class="fas fa-comment-dots" aria-hidden="true"></i> Message <span class="req" aria-hidden="true">*</span></label>
                        <textarea id="message" name="message" class="textarea" placeholder="Write your message here..." required></textarea>
                    </div>

                    <button type="submit" class="btn-solid send-btn">
                        <i class="fas fa-paper-plane" aria-hidden="true"></i> Send message
                    </button>

                </form>
            </div>

            <div class="contact-alt">
                <a href="mailto:allmunanabdullah@gmail.com"><i class="fas fa-envelope" aria-hidden="true"></i> allmunanabdullah@gmail.com</a>
                <a href="https://github.com/abamunan" target="_blank" rel="noopener noreferrer"><i class="fab fa-github" aria-hidden="true"></i> abamunan</a>
            </div>
        </div>
    </main>
    <script src="nav.js"></script>
    <script src="footer.js"></script>
</body>
</html>
