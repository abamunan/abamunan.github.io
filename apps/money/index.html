<!DOCTYPE html>
<html lang="en" class="ui-splash-lock">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Money Tracker | Munan.hub</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A6F48">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money Tracker">
<link rel="manifest" href="/apps/money/manifest.json">
<link rel="apple-touch-icon" href="/apps/money/icon-touch.png">
<link rel="icon" type="image/png" href="/apps/money/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="/theme.js"></script>
<script src="/owner.js"></script>
<link rel="stylesheet" href="/site.css?v=3">
<link rel="stylesheet" href="/apps/shared/ui.css">
<link rel="stylesheet" href="/apps/money/app.css">
</head>
<body class="v2 money-app-body">
<div class="ambient-glow" aria-hidden="true">
  <div class="ambient-orb ambient-orb--1"></div>
  <div class="ambient-orb ambient-orb--2"></div>
  <div class="ambient-orb ambient-orb--3"></div>
</div>

<div id="splash" class="ui-splash" role="progressbar" aria-label="Loading Money Tracker" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-busy="true">
  <div class="ui-splash__inner">
    <div class="ui-splash__title"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h16a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7zm0 0V6a2 2 0 012-2h11"/><circle cx="17" cy="13.5" r="1.2"/></svg> Money Tracker</div>
    <div class="ui-splash__track"><div class="ui-splash__bar"></div></div>
    <div class="ui-splash__label" aria-live="polite">Opening…</div>
  </div>
</div>

<noscript><p style="padding:24px">Money Tracker needs JavaScript.</p></noscript>

<div id="app" class="money-app-shell">
  <!-- Left Sidebar on Desktop / Host on Mobile -->
  <aside class="sidebar-panel" id="sidebarPanel" aria-label="Main Navigation">
    <div class="sidebar-top">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </span>
        <div class="brand-text">
          <p class="brand-kicker">Personal finance</p>
          <h1 class="brand-name">Money tracker</h1>
        </div>
      </div>
    </div>

    <nav id="tabbar" class="sidebar-nav"></nav>

    <div class="sidebar-bottom">
      <button id="sidebarAddBtn" class="sidebar-add-btn" type="button" aria-label="Add transaction">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>Add Entry</span>
      </button>

      <div class="sidebar-footer">
        <div class="sidebar-sync-pill">
          <span class="sync-dot" aria-hidden="true"></span>
          <span id="sidebarSyncLabel" class="sidebar-sync-text">Synced</span>
        </div>
        <button id="sidebarThemeBtn" class="theme-icon-btn" type="button" aria-label="Toggle dark/light theme" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <div class="main-viewport">
    <header class="appbar">
      <div class="brand-lockup mobile-only">
        <span class="brand-mark" aria-hidden="true">$</span>
        <div><p class="brand-kicker">Personal finance</p><h1>Money tracker</h1></div>
      </div>
      <div class="appbar-actions">
        <button id="mobileThemeBtn" class="mobile-theme-btn mobile-only" type="button" aria-label="Toggle theme" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>

    <main id="main" tabindex="-1" aria-label="Money Tracker"></main>
  </div>

  <button id="fab" class="fab" type="button" aria-label="Add entry">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<script type="module" src="/apps/money/main.js"></script>
</body>
</html>
