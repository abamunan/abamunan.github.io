<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diary | Munan.hub</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A private, dated diary with sections — write, revisit, and export your entries.">
<meta name="theme-color" content="#0A6F48">
<link rel="icon" type="image/png" href="icon.png">
<link rel="canonical" href="https://munan.me/diary.html">
<meta property="og:type" content="website">
<meta property="og:url" content="https://munan.me/diary.html">
<meta property="og:site_name" content="Munan.hub">
<meta property="og:title" content="Diary | Munan.hub">
<meta property="og:description" content="A private, dated diary with sections — write, revisit, and export your entries.">
<meta property="og:image" content="https://munan.me/Image.jpeg">
<meta name="twitter:card" content="summary">
    <meta name="twitter:image" content="https://munan.me/Image.jpeg">

<!-- Fonts: Bricolage Grotesque (headings) / Figtree (body) / Hind Siliguri (Bangla) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

<!-- Font Awesome (footer.js renders fa-* icons; navbar/diary UI also use it) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Shared theme logic — blocking, must run before first paint -->
<script src="theme.js"></script>

<script src="owner.js"></script>

<!-- Shared site + app stylesheets (Round 6) -->
<link rel="stylesheet" href="site.css?v=3">
<link rel="stylesheet" href="app.css?v=3">

<link rel="stylesheet" href="diary-page.css?v=3">
</head>
<body class="v2 app app-diary">
<a class="skip" href="#main">Skip to content</a>

<div class="page-content" id="main" role="main">

<!-- ── AUTH GATE (shown while checking session, or when logged out) ── -->
<div class="diary-gate" id="diary-gate">
    <div id="diary-gate-content">
        <div class="diary-checking">
            <i class="fas fa-circle-notch fa-spin"></i>
            <span>Checking your session…</span>
        </div>
    </div>
</div>

<!-- ════════════════ MAIN APP (hidden until auth confirms) ════════════════ -->
<div id="diary-app" style="display:none;">

    <header>
        <h1 class="logo-main">Munan's <span>Diary</span></h1>
        <span class="logo-sub">Write &nbsp;·&nbsp; Organize &nbsp;·&nbsp; Revisit</span>
    </header>

    <div class="diary-tabs">
        <button class="diary-tab active" data-tab="write">Write</button>
        <button class="diary-tab" data-tab="history">History</button>
    </div>

    <!-- ════════════════ WRITE VIEW ════════════════ -->
    <section class="diary-view active" id="view-write">

        <!-- Phase 3: local draft restore notice (never touches Firestore) -->
        <div class="diary-editing-banner diary-draft-banner" id="draft-banner" role="status">
            <i class="fas fa-clock-rotate-left"></i>
            <span id="draft-banner-text">Draft restored — not saved yet.</span>
            <button id="draft-discard-btn" type="button">Discard draft</button>
        </div>

        <!-- Phase 4: shown only if the doc being edited changed elsewhere since load -->
        <div class="diary-editing-banner diary-stale-banner" id="stale-conflict-banner" role="alert">
            <i class="fas fa-triangle-exclamation"></i>
            <span id="stale-conflict-text">This entry changed elsewhere since you started editing.</span>
            <button id="stale-conflict-reload-btn" type="button">Reload latest version</button>
        </div>

        <div class="diary-editing-banner" id="editing-banner">
            <i class="fas fa-pen-to-square"></i>
            <span id="editing-banner-text">Editing an existing entry</span>
            <button id="cancel-edit-btn" type="button">Start new instead</button>
        </div>

        <div class="diary-card" style="align-items:stretch;">
            <div class="diary-datetime-row">
                <div class="diary-field">
                    <label for="entry-date">Date</label>
                    <input type="date" id="entry-date">
                </div>
                <div class="diary-field">
                    <label for="entry-time">Time</label>
                    <input type="time" id="entry-time">
                </div>
            </div>

            <div class="diary-sections" id="sections-container">
                <!-- sections injected by JS -->
            </div>
            <div class="diary-writing-stats" id="writing-stats" aria-live="polite">
                <span><i class="fas fa-font"></i> <strong id="word-count">0</strong> words</span>
                <span><i class="fas fa-text-height"></i> <strong id="character-count">0</strong> characters</span>
                <span><i class="fas fa-layer-group"></i> <strong id="section-count">0</strong> sections</span>
            </div>

            <button class="diary-add-section" id="add-section-btn" type="button">
                <i class="fas fa-plus"></i> Add Section
            </button>
            <div class="diary-section-cap" id="section-cap-msg" style="display:none;">Maximum of 10 sections reached</div>
        </div>

        <div class="diary-actions">
            <button class="diary-btn diary-btn-primary" id="save-entry-btn" type="button">
                <i class="fas fa-floppy-disk"></i> <span id="save-btn-label">Save Entry</span>
            </button>
            <button class="diary-btn diary-btn-ghost" id="clear-form-btn" type="button">
                <i class="fas fa-rotate-left"></i> Clear
            </button>
        </div>

    </section>

    <!-- ════════════════ HISTORY VIEW ════════════════ -->
    <section class="diary-view" id="view-history">

        <div class="diary-history-toolbar">
            <label class="diary-history-search" id="history-search-wrap">
                <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
                <input type="search" id="history-search" placeholder="Search loaded entries…" aria-label="Search loaded diary entries">
                <button type="button" id="clear-history-search" aria-label="Clear search" title="Clear search">
                    <i class="fas fa-xmark"></i>
                </button>
            </label>
            <div class="diary-filter-group" role="group" aria-label="Entries per page">
                <button class="diary-filter-btn active" data-limit="10">10 / page</button>
                <button class="diary-filter-btn" data-limit="50">50 / page</button>
            </div>
            <div class="diary-pdf-btn-group">
                <button class="diary-pdf-btn" id="download-pdf-btn" title="Exports only the entries currently loaded below">
                    <i class="fas fa-file-pdf"></i> Download PDF (loaded)
                </button>
                <button class="diary-pdf-btn diary-pdf-btn-ghost" id="export-all-pdf-btn" title="Fetches your entire diary first, then builds one PDF">
                    <i class="fas fa-cloud-arrow-down"></i> Export All
                </button>
                <button class="diary-pdf-btn diary-pdf-btn-ghost" id="export-json-btn" type="button">
                    <i class="fas fa-download"></i> Backup JSON
                </button>
                <label class="diary-pdf-btn diary-pdf-btn-ghost" for="import-json-input">
                    <i class="fas fa-upload"></i> Restore JSON
                </label>
                <input id="import-json-input" type="file" accept="application/json,.json" hidden>
            </div>
            <div class="diary-history-summary" id="history-summary" role="status"></div>
        </div>

        <div class="diary-entry-list" id="entry-list">
            <div class="diary-loading"><i class="fas fa-circle-notch fa-spin"></i> Loading entries…</div>
        </div>

        <button class="diary-load-more-btn" id="history-load-more-btn" type="button" style="display:none;">
            <i class="fas fa-chevron-down"></i> Load more
        </button>

    </section>

</div><!-- /#diary-app -->

</div><!-- /.page-content -->

<!-- ── READ OVERLAY (view-only entry detail — opened by clicking a History row) ── -->
<div class="diary-read-overlay" id="diary-read-overlay">
    <div class="diary-read-card" role="dialog" aria-modal="true" aria-labelledby="diary-read-date">
        <div class="diary-read-toolbar">
            <button class="diary-read-back" id="diary-read-back-btn" type="button" aria-label="Back to History">
                <i class="fas fa-arrow-left"></i> Back
            </button>
            <div class="diary-read-toolbar-actions">
                <button class="diary-read-delete-btn" id="diary-read-delete-btn" type="button" aria-label="Delete this entry">
                    <i class="fas fa-trash-can"></i> Delete
                </button>
                <button class="diary-read-edit-btn" id="diary-read-edit-btn" type="button" aria-label="Edit this entry">
                    <i class="fas fa-pen"></i> Edit
                </button>
            </div>
        </div>
        <div class="diary-read-header">
            <div class="diary-read-date" id="diary-read-date"></div>
            <div class="diary-read-time" id="diary-read-time"></div>
        </div>
        <div class="diary-read-sections" id="diary-read-sections"></div>
    </div>
</div>

<!-- Toast — aria-live so screen readers announce save/delete/error status without focus ever moving -->
<div class="diary-toast" id="diary-toast" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- ── html2pdf.js (client-side PDF export, per Munan's choice) ── -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!-- ── Firebase (same project as login.html / moneytracker.html / auth.js) ── -->
<script type="module" src="diary.js"></script>

<!-- ── Shared navbar + footer injectors ── -->
<script src="nav.js"></script>
<script src="footer.js"></script>

</body>
</html>
