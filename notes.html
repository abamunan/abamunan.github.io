    <script>
/* ── RENDER ENGINE — no need to edit ─────────────── */
const subjectsEl = document.getElementById('subjects');
const input      = document.getElementById('q');
const cnt        = document.getElementById('cnt');

const totalNotes = NOTE_SUBJECTS.reduce((sum, s) => sum + s.notes.length, 0);

function buildReaderUrl(note) {
  const params = new URLSearchParams();
  params.set('src', note.src);
  params.set('title', note.title);
  if (note.desc) params.set('caption', note.desc);
  return 'reader.html?' + params.toString();
}

function render(q) {
  q = (q || '').toLowerCase().trim();
  subjectsEl.innerHTML = '';

  let shown = 0;

  NOTE_SUBJECTS.forEach((group) => {
    const matches = group.notes.filter(n =>
      !q ||
      n.title.toLowerCase().includes(q) ||
      (n.desc || '').toLowerCase().includes(q) ||
      group.subject.toLowerCase().includes(q)
    );
    if (!matches.length) return;

    shown += matches.length;

    const section = document.createElement('section');
    section.className = 'subject-group';

    section.innerHTML = `
      <div class="subject-head">
        <span class="tile"><i class="${group.icon || 'fa-solid fa-book'}" aria-hidden="true"></i></span>
        <h2>${group.subject}</h2>
        ${group.level ? `<span class="badge">${group.level}</span>` : ''}
      </div>
      <div class="util-list"></div>
    `;

    const list = section.querySelector('.util-list');
    matches.forEach((n) => {
      const a = document.createElement('a');
      a.className = 'util note-row';
      a.href = buildReaderUrl(n);
      a.title = 'Read ' + n.title;
      a.innerHTML = `
        <span class="tile"><i class="fa-solid fa-file-pdf" aria-hidden="true"></i></span>
        <span class="row-body"><span class="row-title">${n.title}</span><span class="row-desc">${n.desc || ''}</span></span>
        <span class="go"><i class="fas fa-arrow-right" aria-hidden="true"></i></span>
      `;
      list.appendChild(a);
    });

    subjectsEl.appendChild(section);
  });

  cnt.textContent = shown + ' note' + (shown !== 1 ? 's' : '');

  if (!shown) {
    subjectsEl.innerHTML = `<div class="empty">
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      No notes found for "<strong>${q}</strong>" — try a different keyword.
    </div>`;
  }
}

input.addEventListener('input', e => render(e.target.value));
render();
    </script>
