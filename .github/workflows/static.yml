# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dev tools
        run: npm install --no-audit --no-fund
      - name: Check for undefined names
        run: npm run lint:names
      - name: Run unit tests
        run: npm test
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir dist
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='audit' \
            --exclude='_trash' \
            --exclude='test-output' \
            --exclude='*.md' \
            --exclude='*.pptx' \
            --exclude='apps/*/tests' \
            --exclude='apps/*/tools' \
            --exclude='tsconfig.check.json' \
            --exclude='node_modules' \
            --exclude='package-lock.json' \
            ./ dist/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -q .; then
              echo "Pages artifact is available."
              exit 0
            fi
            echo "Pages artifact is not visible yet (attempt ${attempt}/12)."
            sleep 5
          done
          echo "::error::Pages artifact did not become visible within 60 seconds."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
