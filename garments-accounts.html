async function updatePartner(pid,key,val){
 if(!shareOpen()){alert('Business share is locked. Tap Unlock and wait 5 minutes to edit.');renderShare();return;}
 const ok=await commitSettings(next=>{
  const p=next.partners.find(x=>x.id===pid);if(!p)return false;
  if(key==='share'){p.share=Math.max(0,parseFloat(val)||0);return;}
  const n=String(val).trim();
  if(!n){alert('Name cannot be empty.');return false;}
  if(n.toLowerCase()===BIZ_NAME.toLowerCase()||next.partners.some(q=>q.id!==pid&&q.name.toLowerCase()===n.toLowerCase())){alert('That name is already used.');return false;}
  if(p.name!==n){p.legacy=Array.from(new Set((p.legacy||[]).concat(p.name)));p.name=n;}   // remember the old name for older records
 });
 if(!ok)renderSettingsLists();
}
function rmStart(pid){   // step 1: start the 10 minute wait
 const p=partnerById(pid);if(!p)return;
 if(!shareOpen()){renderShare();return;}
 const n=partnerUsage(pid);
 if(n>0){alert(`${p.name} has ${n} entr${n===1?'y':'ies'} (capital or payments) and can't be deleted. Rename the partner instead.`);return;}
 LOCKS.rm[pid]=Date.now();saveLocks();renderShare();
}
function rmCancel(pid){delete LOCKS.rm[pid];saveLocks();renderShare();}
function rmNow(pid){   // step 2: only after the wait, and only inside the window that follows it
 const p=partnerById(pid);if(!p)return;
 if(gate(LOCKS.rm[pid],REMOVE_WAIT).s!=='open'){renderShare();return;}
 const n=partnerUsage(pid);
 if(n>0){alert(`${p.name} now has ${n} entr${n===1?'y':'ies'} (capital or payments) and can't be deleted. Rename the partner instead.`);rmCancel(pid);return;}
 if(!confirm(`Remove partner ${p.name}?`))return;
 commitSettings(next=>{next.partners=next.partners.filter(x=>x.id!==pid);}).then(ok=>{if(ok){delete LOCKS.rm[pid];saveLocks();renderShare();}});
}
function addPartner(){
 if(!shareOpen()){alert('Business share is locked. Tap Unlock and wait 5 minutes to edit.');renderShare();return;}
 const n=$('newPartnerName').value.trim();if(!n)return;
 if(n.toLowerCase()===BIZ_NAME.toLowerCase()||S.partners.some(p=>p.name.toLowerCase()===n.toLowerCase())){alert('That name is already used.');return;}
 const share=Math.max(0,parseFloat($('newPartnerShare').value)||0);
 commitSettings(next=>{next.partners.push({id:'p_'+uid(),name:n,share,legacy:[]});}).then(ok=>{if(ok){$('newPartnerName').value='';$('newPartnerShare').value='';}});
}
function addItem(list,inputId){
 if(!listUnlocked[list])return;

 if(list==='categories'){const use=reservedUse(v);if(use){alert(`"${v}" is already counted automatically through ${use}, so it can't be an expense category.`);return;}}

function removeItem(list,name){if(!listUnlocked[list])return;commitSettings(next=>{next[list]=next[list].filter(x=>x!==name);});}
async function renameItem(list,oldName){   // renames the list entry and every saved entry that uses it, so history stays together
 if(!listUnlocked[list])return;
 const raw=prompt(`Rename "${oldName}" to:`,oldName);
 if(raw===null)return;
 const v=raw.trim();
 if(!v||v===oldName)return;
 if(list==='categories'){const use=reservedUse(v);if(use){alert(`"${v}" is already counted automatically through ${use}, so it can't be an expense category.`);return;}}
 if(S[list].some(x=>x!==oldName&&norm(x)===norm(v))){alert('Already in the list.');return;}
 const RENAME_TARGETS={products:{keys:['stock','sales'],field:'product'},couriers:{keys:['sales'],field:'courier'},categories:{keys:['expenses'],field:'category'}};
 const {keys,field}=RENAME_TARGETS[list]||{keys:[],field:''};
 const hit=r=>list==='categories'?r[field]===oldName:norm(r[field])===norm(oldName);
 const affected=[];keys.forEach(k=>state[k].filter(hit).forEach(r=>affected.push([k,r])));
 if(affected.length&&!confirm(`This also renames "${oldName}" on ${affected.length} saved entr${affected.length===1?'y':'ies'}, so the history stays together.\n\nContinue?`))return;
 const ok=await commitSettings(next=>{const i=next[list].indexOf(oldName);if(i<0)return false;next[list][i]=v;});
 if(!ok)return;
 for(const [k,r] of affected){
  const d=clone(r);delete d.id;d[field]=v;stampEdit(d,r);
  if(!(await updateRecord(k,r.id,d))){alert(`The name was changed in the list, but some saved entries could not be updated. Rename "${v}" back and try again when the connection is fine.`);break;}
 }
 refreshActive();
}

/* ---------- 2. Restore from backup (JSON) ---------- */
async function handleRestoreFile(file){
 if(!file)return;
 if(!db){showToast('Restore needs you to be online and logged in.',true);return;}
 let data;
 try{data=JSON.parse(await file.text());}catch(e){showToast('Invalid backup file',true);return;}
 const listsOk=data&&typeof data==='object'&&KEYS.every(k=>Array.isArray(data[k])&&data[k].every(r=>r&&typeof r==='object'));
 if(!data||data.app!=='garments-accounts'||!listsOk){showToast('Invalid backup file',true);return;}
 const counts=KEYS.map(k=>`${(TAB_CONFIGS[k]&&TAB_CONFIGS[k].title)||k}: ${data[k].length}`).join('\n');
 const when=data.exportedAt?new Date(data.exportedAt).toLocaleString():'unknown date';
 if(!confirm(`Restore this backup?\n\nBackup date: ${when}\n${counts}\n\nThis REPLACES the shared data for ALL partners.\n\nContinue?`))return;
 downloadFullBackup(true);   // safety copy of the current data before anything is overwritten
 if(prompt('This cannot be undone. Type RESTORE to continue:')!=='RESTORE'){showToast('Restore cancelled');return;}
 await runRestore(data);
}
async function runRestore(data){
 try{
  for(const key of KEYS){
   const incoming=data[key];
   const incomingIds=new Set(incoming.map(r=>r.id).filter(id=>id&&!isLocalId(id)));
   const toDelete=state[key].map(r=>r.id).filter(id=>!isLocalId(id)&&!incomingIds.has(id));
   const label=(TAB_CONFIGS[key]&&TAB_CONFIGS[key].title)||key;
   const ops=incoming.map(rec=>()=>{
    const d=clone(rec);const id=d.id;delete d.id;
    return (!id||isLocalId(id))?db.collection(key).add(d):db.collection(key).doc(id).set(d);
   }).concat(toDelete.map(id=>()=>db.collection(key).doc(id).delete()));
   for(let i=0;i<ops.length;i+=15){
    showToast(`Restoring ${label}… ${Math.min(i+15,ops.length)}/${ops.length}`);
    try{await Promise.all(ops.slice(i,i+15).map(fn=>fn()));}
    catch(e){console.error(e);showToast(`Restore failed while writing ${label} — run the same restore again.`,true);return;}
    await yieldToUI();
   }
  }
  showToast('Restoring settings…');
  try{
   const nextSettings=clone(data.settings||{});
   await db.doc('settings/main').set(nextSettings);
   S=Object.assign({},S,nextSettings);normalizeSettings();
  }catch(e){console.error(e);showToast('Restore failed while writing settings — run the same restore again.',true);return;}
  // the onSnapshot listeners refresh `state` by themselves — never overwrite it manually here
  refreshActive();
  showToast('Backup restored');
 }catch(e){console.error(e);showToast('Restore failed — run the same restore again.',true);}
}

function csvColumnsFor(key){

  header:f.label,type:f.type,

/* Adapter: gives the ledger code the small db API it was written for
   (collection().add / doc().set / doc().delete / onSnapshot) on top of Firestore. */
function makeDb(fs,fstore){
 const C=(key)=>fs.collection(fstore,ROOT,key,'items');
 return {
  collection:key=>({
   add:async data=>{const r=await fs.addDoc(C(key),data);return {id:r.id};},
   doc:id=>({
    set:data=>fs.setDoc(fs.doc(fstore,ROOT,key,'items',id),data),
    delete:()=>fs.deleteDoc(fs.doc(fstore,ROOT,key,'items',id))}),
   onSnapshot:(ok,err)=>fs.onSnapshot(C(key),ok,err)}),
  doc:path=>{   // only used for 'settings/main'
   const ref=fs.doc(fstore,ROOT,'settings');
   // the modern SDK has snap.exists() as a METHOD; the ledger code reads snap.exists as a value
   return {set:data=>fs.setDoc(ref,data),
    onSnapshot:(ok,err)=>fs.onSnapshot(ref,snap=>{const has=snap.exists();ok({exists:has,data:()=>has?snap.data():undefined});},err)};}
 };
}

async function connect(){
 bootUi();
 if(!db){setStatus('offline');refreshActive();return;}
 await uploadOfflineRecords();
 KEYS.forEach(key=>{
  try{db.collection(key).onSnapshot(snap=>{
   const unsent=state[key].filter(r=>isLocalId(r.id));   // offline entries that could not be uploaded yet: never overwrite them
   state[key]=snap.docs.map(d=>Object.assign(clone(d.data()),{id:d.id})).concat(unsent);
   setStatus('synced');cacheLocal();refreshActive(true);
  },()=>setStatus('error'));}catch(e){setStatus('error');}
 });
 try{db.doc('settings/main').onSnapshot(snap=>{
  if(snap.exists){S=Object.assign({},S,clone(snap.data()));normalizeSettings();cacheLocal();}
  refreshActive(true);
 },()=>setStatus('error'));}catch(e){setStatus('error');}
 setStatus('synced');
}

  var op = null;          // pending operator
  var fresh = false;      // next digit starts a new number
  var done = false;       // just pressed equals
  var err = false;        // showing an error
  var overwrite = false;  // number came from history; next digit replaces it
  var expr = '';          // small line above the result
  var trail = '';         // full expression so far, e.g. "5 + 3 ×"

  function loadHistory() {
    var arr = readJSON(K_HIST);
    if (!Array.isArray(arr)) return [];
    return arr.filter(function (h) {
      return h && typeof h.x === 'string' && h.x.length <= 200 &&
             typeof h.r === 'string' && /^-?[0-9.]+(e-?[0-9]+)?$/.test(h.r);
    }).slice(0, MAX_HISTORY);
  }
  var history = loadHistory();
  function saveHistory() { lsSet(K_HIST, JSON.stringify(history)); }

  function toStr(n) {
    n = parseFloat(n.toPrecision(12));
    var s = String(n);
    if (s.indexOf('e') !== -1 || Math.abs(n) >= 1e15) {
      s = n.toExponential(6).replace(/\.?0+e/, 'e').replace('e+', 'e');
    }
    return s;
  }
  function fmt(s) {
    if (s.indexOf('e') !== -1) return s;
    var neg = s.charAt(0) === '-';
    if (neg) s = s.slice(1);
    var parts = s.split('.');
    var int = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '\u2212' : '') + int + (parts.length > 1 ? '.' + parts[1] : '');
  }
  function clip(s) { return s.length > 26 ? '\u2026' + s.slice(-25) : s; }

  function update() {
    var text;
    if (err) {
      text = "Can't divide by 0";
      resEl.className = 'mtc-result mtc-msg';
    } else {
      text = fmt(cur);
      var len = text.length;
      resEl.className = 'mtc-result' + (len > 14 ? ' mtc-xs' : len > 11 ? ' mtc-sm' : len > 8 ? ' mtc-md' : '');
    }
    resEl.textContent = text;
    exprEl.textContent = expr ? clip(expr) : '\u00A0';
    if (history.length) { badgeEl.hidden = false; badgeEl.textContent = history.length; }
    else { badgeEl.hidden = true; }
  }

  function reset() {
    cur = '0'; prev = null; op = null;
    fresh = false; done = false; err = false; overwrite = false;
    expr = ''; trail = '';
  }
  function compute(a, o, b) {
    var r;
    if (o === '+') r = a + b;
    else if (o === '-') r = a - b;
    else if (o === '*') r = a * b;
    else if (o === '/') { if (b === 0) return null; r = a / b; }
    return isFinite(r) ? r : null;
  }
  function fail() { reset(); err = true; update(); }

  function startNew() {
    if (err) reset();
    if (fresh || done) {
      cur = '0'; fresh = false;
      if (done) { expr = ''; trail = ''; done = false; }
    } else if (overwrite) {
      cur = '0';
    }
    overwrite = false;
  }
  function digit(d) {
    startNew();
    if (cur === '0') cur = d;
    else if (cur.replace(/[-.]/g, '').length < MAX_DIGITS) cur += d;
    update();
  }
  function dot() {
    startNew();
    if (cur.indexOf('.') === -1) cur += '.';
    update();
  }
  function operator(o) {
    if (err) return;
    var v = parseFloat(cur);
    if (op && fresh) {
      trail = trail.slice(0, -1) + SYM[o];            // pressed twice: swap operator
    } else if (op) {
      var r = compute(prev, op, v);                   // chain: 5 + 3 × …
      if (r === null) return fail();
      trail += ' ' + fmt(toStr(v)) + ' ' + SYM[o];
      prev = r; cur = toStr(r);
    } else {
      prev = v;
      trail = fmt(toStr(v)) + ' ' + SYM[o];
    }
    op = o; fresh = true; done = false; overwrite = false;
    expr = trail;
    update();
  }
  function equals() {
    if (err || !op) return;
    var b = parseFloat(cur);
    var r = compute(prev, op, b);
    if (r === null) return fail();
    var full = trail + ' ' + fmt(toStr(b));
    var res = toStr(r);

    history.unshift({ x: full, r: res });
    if (history.length > MAX_HISTORY) history.length = MAX_HISTORY;
    saveHistory();

    expr = full + ' =';
    cur = res; prev = null; op = null; trail = '';
    done = true; fresh = false; overwrite = false;
    update();
  }
  function percent() {
    if (err) return;
    cur = toStr(parseFloat(cur) / 100);
    update();
  }
  function negate() {
    if (err || cur === '0') return;
    cur = cur.charAt(0) === '-' ? cur.slice(1) : '-' + cur;
    update();
  }
  function backspace() {
    if (err) { reset(); update(); return; }
    if (done || fresh || overwrite) return;
    cur = cur.slice(0, -1);
    if (cur === '' || cur === '-') cur = '0';
    update();
  }
  function handle(k) {
    if (/^[0-9]$/.test(k)) digit(k);
    else if (k === '.') dot();
    else if (k === '+' || k === '-' || k === '*' || k === '/') operator(k);
    else if (k === '=') equals();
    else if (k === 'ac') { reset(); update(); }
    else if (k === 'bs') backspace();
    else if (k === 'pct') percent();
    else if (k === 'neg') negate();
  }

  /* ───────────────────────────── history panel ───────────────────────────── */
  var clearTimer = null;
  function disarm() {
    clearTimeout(clearTimer); clearTimer = null;
    clearBtn.textContent = 'Clear all';
    clearBtn.classList.remove('mtc-armed');
  }
  function renderHistory() {
    listEl.textContent = '';
    history.forEach(function (h, i) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'mtc-h-item';
      b.setAttribute('data-i', String(i));
      b.setAttribute('aria-label', 'Use ' + fmt(h.r) + ' from ' + h.x);
      var x = document.createElement('span'); x.className = 'mtc-h-x'; x.textContent = h.x + ' =';
      var r = document.createElement('span'); r.className = 'mtc-h-r'; r.textContent = fmt(h.r);
      b.appendChild(x); b.appendChild(r); li.appendChild(b); listEl.appendChild(li);
    });
    var n = history.length;
    emptyEl.hidden = n > 0;
    listEl.hidden = n === 0;
    clearBtn.hidden = n === 0;
    countEl.textContent = n + ' of ' + MAX_HISTORY + ' saved';
    disarm();
  }
  function setInert(state) { screenEl.inert = state; keysEl.inert = state; }
  function openHistory() {
    renderHistory();
    histPanel.hidden = false;
    setInert(true);
    histBtn.setAttribute('aria-expanded', 'true');
    histClose.focus();
  }
  function closeHistory(refocus) {
    histPanel.hidden = true;
    setInert(false);
    histBtn.setAttribute('aria-expanded', 'false');
    if (refocus !== false) histBtn.focus();
  }
  function recall(i) {
    var h = history[i];
    if (!h) return;
    if (err) reset();
    cur = h.r; fresh = false;
    if (op) {
      overwrite = true;          // mid-calculation: use it as the next number
    } else {
      prev = null; trail = ''; done = true; overwrite = false;
      expr = h.x + ' =';
    }
    closeHistory();
    update();
  }

  histBtn.addEventListener('click', openHistory);
  histClose.addEventListener('click', function () { closeHistory(); });
  listEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-i]');
    if (btn) recall(parseInt(btn.getAttribute('data-i'), 10));
  });
  clearBtn.addEventListener('click', function () {
    if (clearTimer) {                       // second tap within 3 s → really clear
      history = []; saveHistory(); renderHistory(); update();
      histClose.focus();
      return;
    }
    clearBtn.textContent = 'Tap again to clear';
    clearBtn.classList.add('mtc-armed');
    clearTimer = setTimeout(disarm, 3000);
  });

  /* ───────────────────────────── key input ───────────────────────────── */
  keysEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-k]');
    if (btn) handle(btn.getAttribute('data-k'));
  });

  function flash(k) {
    var btn = keysEl.querySelector('button[data-k="' + k.replace(/"/g, '') + '"]');
    if (!btn) return;
    btn.classList.add('mtc-pressed');
    setTimeout(function () { btn.classList.remove('mtc-pressed'); }, 110);
  }

  // Keyboard works only while the window is open, and never steals keystrokes
  // from the app's own amount / note / search fields.
  document.addEventListener('keydown', function (e) {
    if (!winOpen || e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target;
    var inside = win.contains(t);
    if (!inside && t !== document.body && t !== document.documentElement) return;

    var key = e.key, k = null;
    if (!histPanel.hidden) {
      if (key === 'Escape') { e.preventDefault(); closeHistory(); }
      return;
    }
    if (/^[0-9]$/.test(key)) k = key;
    else if (key === '.' || key === ',') k = '.';
    else if (key === '+' || key === '-' || key === '*' || key === '/') k = key;
    else if (key === 'Enter' || key === '=') k = '=';
    else if (key === 'Backspace') k = 'bs';
    else if (key === 'Delete') k = 'ac';
    else if (key === '%') k = 'pct';
    else if (key === 'Escape') { e.preventDefault(); closeWin(); return; }
    if (k === null) return;
    e.preventDefault();
    handle(k);
    flash(k);
  });

  /* ───────────────────────────── start-up ───────────────────────────── */
  update();
  applyVisibility(true);
})();

</script>
</body>
</html>
