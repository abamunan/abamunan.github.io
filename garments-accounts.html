<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garments Accounts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Icons used by the floating calculator (fa-calculator, fa-xmark, fa-clock-rotate-left, magnifying glasses) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
 --accent:#1B3A5C;--accent2:#1E8449;--accent2-glow:rgba(30,132,73,.2);--danger:#B23A3A;--danger-glow:rgba(178,58,58,.2);
 --warn:#9A6408;--warn-bg:rgba(201,138,18,.13);
 --surface:rgba(27,58,92,.06);--surface2:rgba(27,58,92,.12);--card-bg:#fff;--card-border:rgba(27,58,92,.18);
 --nav-bg:#1B3A5C;--text-main:#1a2632;--text-soft:#5c6b7a;--bg:#F4F6F8;--radius-lg:16px;--radius-md:10px;--font:'Poppins',Arial,sans-serif;
 --card-bg-solid:var(--card-bg); /* alias for the floating calculator's CSS, follows light/dark automatically */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#4A7BA6;--accent2:#3FA873;--accent2-glow:rgba(63,168,115,.2);--danger:#D97575;--danger-glow:rgba(217,117,117,.2);--warn:#E0A94A;--warn-bg:rgba(224,169,74,.14);--surface:rgba(255,255,255,.06);--surface2:rgba(255,255,255,.11);--card-bg:#16283D;--card-border:rgba(74,123,166,.25);--nav-bg:#0F2233;--text-main:#EAF0F6;--text-soft:#9CB0C2;--bg:#0B1622;}}
:root[data-theme="dark"]{--accent:#4A7BA6;--accent2:#3FA873;--accent2-glow:rgba(63,168,115,.2);--danger:#D97575;--danger-glow:rgba(217,117,117,.2);--warn:#E0A94A;--warn-bg:rgba(224,169,74,.14);--surface:rgba(255,255,255,.06);--surface2:rgba(255,255,255,.11);--card-bg:#16283D;--card-border:rgba(74,123,166,.25);--nav-bg:#0F2233;--text-main:#EAF0F6;--text-soft:#9CB0C2;--bg:#0B1622;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:var(--bg);color:var(--text-main);font-family:var(--font);padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.hidden{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px 40px}
.top{background:var(--nav-bg);color:#fff;border-radius:var(--radius-lg);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 8px 22px rgba(0,0,0,.18)}
.top h1{font-size:1.02rem;margin:0;font-weight:700}
.top p{margin:2px 0 0;font-size:.7rem;opacity:.8}
.status{font-size:.64rem;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.15);white-space:nowrap}
.tabbar{display:flex;gap:6px;overflow-x:auto;margin:14px 0;padding-bottom:2px;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tabbtn{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--card-border);background:var(--card-bg);color:var(--text-soft);font:600 .76rem var(--font);cursor:pointer}
.tabbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tabpanel{display:none}
.section{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:14px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.section h2{font-size:.85rem;margin:0;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:12px 14px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card .l{font-size:.64rem;color:var(--text-soft);font-weight:600;text-transform:uppercase}
.card .v{font-size:1.05rem;font-weight:700;margin-top:4px;overflow-wrap:anywhere}
.card.in .v{color:var(--accent2)}.card.out .v{color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row.end{align-items:flex-end}
.field{flex:1;min-width:110px;display:flex;flex-direction:column;gap:4px;margin-top:8px}
.field label{font-size:.66rem;color:var(--text-soft);font-weight:600}
.field.wide{flex:2}.field.narrow{max-width:100px}
input,select{font:500 .82rem var(--font);padding:9px 10px;border:1px solid var(--card-border);border-radius:var(--radius-md);background:var(--surface);color:var(--text-main);width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.addbtn{margin-top:12px;width:100%;padding:11px;border:0;border-radius:var(--radius-md);font:700 .84rem var(--font);color:#fff;cursor:pointer;background:var(--accent2);box-shadow:0 4px 16px var(--accent2-glow)}
.addbtn:disabled{opacity:.6;cursor:wait}
.ghostbtn{margin-top:8px;width:100%;padding:10px;border:1px solid var(--card-border);border-radius:var(--radius-md);background:transparent;color:var(--text-main);font:600 .8rem var(--font);cursor:pointer}
.btngrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.btngrid .ghostbtn{margin-top:0}
.hint{font-size:.66rem;color:var(--text-soft);margin-top:8px;line-height:1.5}
.warnbox{background:var(--warn-bg);border:1px solid var(--warn);color:var(--text-main);border-radius:var(--radius-md);padding:10px 12px;font-size:.74rem;margin-bottom:14px;line-height:1.5}
.warnbox ul{margin:6px 0 0;padding-left:18px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.76rem;min-width:620px}
th{text-align:left;color:var(--text-soft);font-size:.62rem;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--card-border)}
td{padding:8px;border-bottom:1px solid var(--card-border);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.editing td{background:var(--surface)}
tr.total td{font-weight:700}
tbody[id^="tbl_"] td:first-child{white-space:nowrap}
.sub{display:block;font-size:.62rem;color:var(--text-soft);font-weight:500;margin-top:2px}
.badge{padding:2px 8px;border-radius:999px;font-size:.62rem;font-weight:700;color:#fff;display:inline-block}
.b-ok{background:var(--accent2)}.b-bad{background:var(--danger)}.b-soft{background:var(--text-soft)}
.amt.income{color:var(--accent2);font-weight:700}.amt.expense{color:var(--danger);font-weight:700}
.rowbtns{white-space:nowrap;text-align:right}
.del,.edit{border:0;background:transparent;color:var(--text-soft);cursor:pointer;font-size:.85rem;padding:4px 6px}
.del:hover{color:var(--danger)}
.edit:hover{color:var(--accent)}
.empty{text-align:center;color:var(--text-soft);padding:14px 0}
.kv-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--card-border);font-size:.78rem}
.kv-row:last-child{border-bottom:0}
.kv-strong{font-weight:700}
.kv-row span:last-child{white-space:nowrap;flex-shrink:0}
.kv-row span:first-child{min-width:0}
.catbar-row{display:flex;align-items:center;gap:8px;font-size:.74rem;margin-bottom:7px}
.catbar-name{width:110px;flex-shrink:0;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catbar-track{flex:1;height:8px;border-radius:6px;background:var(--surface);overflow:hidden}
.catbar-fill{height:100%;background:var(--danger);border-radius:6px}
.catbar-amt{width:70px;text-align:right;font-weight:700;flex-shrink:0}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--card-border);font-size:.74rem;margin:3px 4px 3px 0}
.tag button{border:0;background:transparent;color:var(--text-soft);cursor:pointer;font-size:.68rem}
.sechead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.sortsel{width:auto;max-width:180px;padding:6px 8px;font-size:.72rem;cursor:pointer}
.lockbtn{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:999px;border:1px solid var(--card-border);background:var(--surface);color:inherit;font:700 .68rem var(--font);cursor:pointer;white-space:nowrap}
.lockbtn.open{border-color:var(--accent2);color:var(--accent2)}
.lockmsg{font-size:.7rem;color:var(--text-soft);margin-top:8px;line-height:1.6}.lockmsg b{color:inherit}
.sechead+.lockmsg{margin:0 0 10px}
.subh{font-size:.62rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-soft);font-weight:700;margin:14px 0 2px}
.bigcash{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 12px;border-radius:var(--radius-md);background:var(--surface)}
.bigcash .l{font-size:.72rem;color:var(--text-soft);font-weight:600}
.bigcash .v{font-size:1.3rem;font-weight:700;overflow-wrap:anywhere}
.pgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.pgrid{grid-template-columns:repeat(2,1fr)}}
.pcard{border:1px solid var(--card-border);border-radius:var(--radius-md);padding:10px 12px;background:var(--card-bg)}
.pcard h3{margin:0 0 4px;font-size:.84rem;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.minibtn{padding:5px 11px;border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--accent);font:700 .66rem var(--font);cursor:pointer}
.minibtn.solid{background:var(--accent);color:#fff}
.minibtn.danger{background:var(--danger);border-color:var(--danger)}
.limit{font-size:.7rem;line-height:1.6;margin-top:10px;padding:8px 10px;border-radius:var(--radius-md);background:var(--surface)}
.limit.bad{background:var(--danger-glow);color:var(--danger)}
/* phones: 16px inputs stop iOS Safari from zooming in on focus */
@media (max-width:640px){input,select,.sortsel{font-size:16px}}

/* ---------- login / access gate ---------- */
.authbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:.7rem;color:var(--text-soft)}
.authbar .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.authbar .who i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font:700 .68rem var(--font);flex-shrink:0}
.authbar .who b{color:var(--text-main);font-weight:600}
.authbar .who .em{overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.authbar .who .em{display:none}}
.authbtns{display:flex;gap:6px;flex-shrink:0}
.abtn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid var(--card-border);background:var(--card-bg);color:var(--text-main);font:600 .72rem var(--font);cursor:pointer;text-decoration:none;white-space:nowrap}
.abtn:hover{border-color:var(--accent)}
.abtn.out{color:var(--danger);border-color:var(--danger)}
.abtn.out:hover{background:var(--danger-glow)}
.abtn.in{background:var(--accent2);border-color:var(--accent2);color:#fff}
.gate{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.gatebox{width:100%;max-width:400px;text-align:center;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:28px 22px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.gatebox h2{margin:12px 0 8px;font-size:1.05rem}
.gatebox p{margin:0 0 6px;font-size:.78rem;color:var(--text-soft);line-height:1.6;overflow-wrap:anywhere}
.gatebox p b{color:var(--text-main)}
.gatebox .abtn{margin:14px 4px 0;padding:10px 18px;font-size:.78rem}
.gicon{width:54px;height:54px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:var(--surface2)}
.gicon.bad{background:var(--danger-glow)}
.spinr{width:34px;height:34px;margin:0 auto;border:3px solid var(--surface2);border-top-color:var(--accent);border-radius:50%;animation:gspin .8s linear infinite}
@keyframes gspin{to{transform:rotate(360deg)}}
.by{display:inline-block;margin-top:3px;padding:1px 7px;border-radius:999px;background:var(--surface2);color:var(--text-soft);font-size:.6rem;font-weight:600;white-space:nowrap}
.bys{display:block;line-height:1.5}
/* ---------- toast (Backup & Export) ---------- */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:90vw;background:var(--accent);color:#fff;padding:10px 18px;border-radius:999px;font:600 .78rem var(--font);box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:10000;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.toast.err{background:var(--danger)}

/* ========================================================================
   Floating Calculator (integrated from floating-calculator.html)
   ======================================================================== */
/* ==========================================================================
   PART 1 — mt-calc.css  (copied from the app, + size controls)
   ========================================================================== */
/* ==========================================================================
   mt-calc.css — Floating calculator for Money Tracker

   Everything is prefixed .mtc- so nothing collides with mt.css / style.css
   (style.css already has an unrelated .key class, for example).
   Colours come from the page's own tokens (--accent, --accent2, --danger,
   --surface, --card-bg-solid ...), so light / dark follows
   [data-theme="dark"] with no extra work.

   Layer order in this app:  nav 100 · toast 200 · nav drawer 250 ·
   modals 300 · calculator 390-400 · splash 9999.
   The calculator sits above the modals on purpose, so you can use it while
   the Debts / Search sheets are open.
   ========================================================================== */

.mtc-hidden { display: none !important; }

/* Invisible probe — lets JS read the phone's safe-area insets (notch / home bar). */
.mtc-probe {
  position: fixed; top: 0; left: 0; width: 0; height: 0;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  visibility: hidden; pointer-events: none;
}

/* ── FLOATING ICON ─────────────────────────────────────────────────────── */
.mtc-fab {
  position: fixed; left: 0; top: 0; z-index: 400;
  width: 54px; height: 54px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.92);
  background: var(--accent);
  color: #fff; font-size: 1.3rem;
  box-shadow: 0 8px 22px rgba(0,0,0,0.28), 0 2px 6px rgba(0,0,0,0.18);
  cursor: grab;
  /* Position comes from JS via the `translate` property; `scale` / opacity animate separately. */
  will-change: translate;
  transition: scale 140ms ease, opacity 140ms ease, box-shadow 140ms ease;
  touch-action: none;
  user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
[data-theme="dark"] .mtc-fab { border-color: rgba(255,255,255,0.24); }
.mtc-fab:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.mtc-fab.mtc-dragging {
  cursor: grabbing; scale: 1.12;
  box-shadow: 0 16px 34px rgba(0,0,0,0.38), 0 4px 10px rgba(0,0,0,0.22);
}
/* Over the ✕: the icon melts into it so the red ✕ stays clearly visible. */
.mtc-fab.mtc-over { scale: 0.6; opacity: 0; }
.mtc-fab.mtc-vanish { scale: 0.2; opacity: 0; }
.mtc-fab.mtc-pop { animation: mtcFabPop 240ms cubic-bezier(.2,1.3,.4,1); }
@keyframes mtcFabPop { from { scale: 0.4; opacity: 0; } to { scale: 1; opacity: 1; } }

/* Ring that pings twice so you can spot the icon after "Add Calculator". */
.mtc-fab::after {
  content: ''; position: absolute; inset: -2px; border-radius: 50%;
  border: 2px solid var(--accent); opacity: 0; pointer-events: none;
}
.mtc-fab.mtc-ping::after { animation: mtcPing 900ms ease-out 2; }
@keyframes mtcPing {
  0%   { opacity: 0.75; transform: scale(1); }
  100% { opacity: 0;    transform: scale(2); }
}

/* ── REMOVE TARGET (appears while you hold / drag the icon) ────────────── */
.mtc-drop {
  position: fixed; left: 0; right: 0; bottom: 0; height: 230px;
  z-index: 390; pointer-events: none;
  background: linear-gradient(to top, rgba(0,0,0,0.42), rgba(0,0,0,0));
  opacity: 0; transition: opacity 160ms ease;
}
.mtc-drop.mtc-show { opacity: 1; }

.mtc-drop-x {
  position: absolute; left: 50%; margin-left: -32px;
  bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  width: 64px; height: 64px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(20,20,20,0.74); color: #fff; font-size: 1.5rem;
  border: 2px solid rgba(255,255,255,0.55);
  translate: 0 16px;
  transition: scale 140ms ease, background 140ms ease, border-color 140ms ease, translate 180ms ease;
}
.mtc-drop.mtc-show .mtc-drop-x { translate: 0 0; }
.mtc-drop.mtc-over .mtc-drop-x { scale: 1.28; background: var(--danger); border-color: #fff; }

.mtc-drop-label {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(96px + 64px + 12px + env(safe-area-inset-bottom, 0px));
  padding: 4px 11px; border-radius: 999px;
  background: rgba(20,20,20,0.74); color: #fff;
  font: 600 0.7rem/1.3 var(--font, sans-serif); white-space: nowrap;
}

/* ── WINDOW ────────────────────────────────────────────────────────────── */
.mtc-win {
  position: fixed; left: 0; top: 0; z-index: 400;
  /* 296px at 100 %. --mtc-s (0.4 – 1.3) is set by JS from the − / + buttons. */
  width: calc(296px * var(--mtc-s, 1)); max-width: calc(100vw - 12px);
  outline: none;
}
.mtc-win-in {
  zoom: var(--mtc-s, 1);   /* scales everything inside the window */
  background: var(--card-bg-solid, #fff);
  border: 1px solid var(--card-border);
  border-radius: 18px;
  box-shadow: 0 18px 50px rgba(0,0,0,0.32), 0 2px 10px rgba(0,0,0,0.12);
  overflow: hidden;
  font-family: var(--font, 'Poppins', sans-serif);
  color: var(--text-main);
}
.mtc-win-in.mtc-pop { animation: mtcWinPop 190ms cubic-bezier(.2,.9,.3,1.1); }
@keyframes mtcWinPop {
  from { transform: scale(0.55); opacity: 0; }
  to   { transform: scale(1);    opacity: 1; }
}
.mtc-win.mtc-moving .mtc-win-in { box-shadow: 0 26px 60px rgba(0,0,0,0.42), 0 4px 14px rgba(0,0,0,0.16); }

/* Header = drag handle + close button */
.mtc-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 6px 6px 6px 14px;
  background: var(--nav-bg); color: #fff;
  cursor: grab; touch-action: none;
  user-select: none; -webkit-user-select: none;
}
.mtc-win.mtc-moving .mtc-head { cursor: grabbing; }
.mtc-title { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 700; }
.mtc-x {
  width: 36px; height: 36px; padding: 0; border: 0; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; color: #fff; font-size: 1.05rem; cursor: pointer;
  transition: background 120ms ease;
}
.mtc-x:hover { background: rgba(255,255,255,0.16); }
.mtc-x:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }

/* Size controls:  −  100%  +  ✕ */
.mtc-tools { display: flex; align-items: center; gap: 2px; }
.mtc-sz {
  width: 32px; height: 36px; padding: 0; border: 0; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; color: #fff; font-size: 0.95rem; cursor: pointer;
  transition: background 120ms ease, opacity 120ms ease;
}
.mtc-sz:hover:not(:disabled) { background: rgba(255,255,255,0.16); }
.mtc-sz:disabled { opacity: 0.32; cursor: default; }
.mtc-sz:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }
.mtc-pct {
  min-width: 38px; text-align: center;
  font-size: 0.7rem; font-weight: 700; opacity: 0.9;
  font-variant-numeric: tabular-nums;
}

.mtc-body { position: relative; padding: 10px; }

/* Screen */
.mtc-screen {
  height: 122px; padding: 8px 12px 6px;
  display: flex; flex-direction: column;
  text-align: right; overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  font-variant-numeric: tabular-nums;
}
.mtc-screen-top { align-self: flex-start; }
.mtc-hbtn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 26px; padding: 0 10px 0 9px;
  border: 1px solid var(--card-border); border-radius: 999px;
  background: transparent; color: var(--text-soft);
  font: 600 0.7rem/1 var(--font, sans-serif); cursor: pointer;
}
.mtc-hbtn:hover { color: var(--accent); border-color: var(--accent); }
.mtc-hbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mtc-hbtn i { font-size: 0.72rem; }
.mtc-badge {
  min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  background: var(--accent); color: #fff;
  font-size: 0.6rem; line-height: 16px; text-align: center;
}
.mtc-badge[hidden] { display: none; }

.mtc-expr {
  margin-top: auto; min-height: 18px;
  font-size: 0.72rem; color: var(--text-soft);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mtc-result {
  height: 44px; line-height: 44px;
  font-size: 1.85rem; font-weight: 600; color: var(--text-main);
  white-space: nowrap; overflow: hidden;
}
.mtc-result.mtc-md  { font-size: 1.5rem; }
.mtc-result.mtc-sm  { font-size: 1.2rem; }
.mtc-result.mtc-xs  { font-size: 1rem; }
.mtc-result.mtc-msg { font-size: 0.95rem; color: var(--danger); }

/* Keys */
.mtc-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.mtc-k {
  height: 48px; padding: 0;
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg, 12px);
  background: var(--card-bg-solid, #fff); color: var(--text-main);
  font: 600 1.05rem/1 var(--font, sans-serif);
  cursor: pointer;
  transition: transform 80ms ease, background 120ms ease, filter 120ms ease;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.mtc-k:hover { background: var(--surface); }
.mtc-k.mtc-fn { background: var(--surface2); }
.mtc-k.mtc-fn:hover { filter: brightness(0.96); }
.mtc-k.mtc-op { background: var(--accent); border-color: var(--accent); color: #fff; font-size: 1.25rem; }
.mtc-k.mtc-eq { background: var(--accent2); border-color: var(--accent2); color: #fff; font-size: 1.3rem; }
.mtc-k.mtc-op:hover, .mtc-k.mtc-eq:hover { filter: brightness(1.1); }
[data-theme="dark"] .mtc-k.mtc-eq { color: #04170f; }
.mtc-k:active, .mtc-k.mtc-pressed { transform: scale(0.94); }
.mtc-k:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* History panel (covers the body, not the header — so the window stays draggable) */
.mtc-hist {
  position: absolute; inset: 0; z-index: 2;
  display: flex; flex-direction: column; gap: 10px; padding: 10px;
  background: var(--card-bg-solid, #fff);
}
.mtc-hist[hidden] { display: none; }
.mtc-h-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mtc-h-title { font-size: 0.95rem; font-weight: 700; color: var(--text-main); }
.mtc-h-sub { margin-top: 1px; font-size: 0.66rem; color: var(--text-soft); }
.mtc-h-actions { display: flex; align-items: center; gap: 4px; }
.mtc-h-clear {
  padding: 8px 9px; border: 0; border-radius: 9px;
  background: transparent; color: var(--text-soft);
  font: 600 0.72rem/1 var(--font, sans-serif); cursor: pointer;
}
.mtc-h-clear[hidden] { display: none; }
.mtc-h-clear.mtc-armed { background: var(--danger); color: #fff; }
.mtc-h-close {
  width: 34px; height: 34px; padding: 0; border: 0; border-radius: 10px;
  background: var(--surface2); color: var(--text-main);
  font-size: 1rem; cursor: pointer;
}
.mtc-h-clear:focus-visible, .mtc-h-close:focus-visible, .mtc-h-item:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.mtc-h-list {
  list-style: none; flex: 1; min-height: 0; overflow-y: auto;
  display: flex; flex-direction: column; gap: 6px; padding-right: 2px;
}
.mtc-h-list[hidden] { display: none; }
.mtc-h-item {
  width: 100%; padding: 8px 12px;
  display: flex; flex-direction: column; align-items: flex-end; gap: 1px;
  border: 1px solid var(--card-border); border-radius: 10px;
  background: var(--surface); color: var(--text-main);
  font-family: var(--font, sans-serif); font-variant-numeric: tabular-nums;
  text-align: right; cursor: pointer;
  transition: transform 80ms ease;
}
.mtc-h-item:active { transform: scale(0.98); }
.mtc-h-x { font-size: 0.68rem; color: var(--text-soft); overflow-wrap: anywhere; }
.mtc-h-r { font-size: 1.05rem; font-weight: 700; overflow-wrap: anywhere; }
.mtc-h-empty {
  margin: auto 0; padding: 0 10px; text-align: center;
  font-size: 0.78rem; line-height: 1.5; color: var(--text-soft);
}
.mtc-h-empty[hidden] { display: none; }

/* ── SETTINGS → TOOLS TAB ──────────────────────────────────────────────── */
/* Six tabs now instead of five: let them size to their text (and scroll a
   little on very narrow phones) so "Categories" isn't squeezed. */
#settingsModal .modal-tabs { overflow-x: auto; scrollbar-width: none; }
#settingsModal .modal-tabs::-webkit-scrollbar { display: none; }
#settingsModal .modal-tab { flex: 1 0 auto; padding-left: 8px; padding-right: 8px; white-space: nowrap; }

.mtc-status {
  display: flex; align-items: center; gap: 9px;
  margin: 0 0 12px; padding: 10px 12px;
  border: 1px solid var(--card-border); border-radius: var(--radius-lg, 12px);
  background: var(--surface);
  font-size: 0.8rem; font-weight: 600; color: var(--text-main);
}
.mtc-status::before {
  content: ''; flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent2);
}
.mtc-status.mtc-status-off::before { background: var(--text-soft); }

/* ── MISC ──────────────────────────────────────────────────────────────── */
@media (min-width: 900px) {
  .mtc-drop-x     { bottom: 44px; }
  .mtc-drop-label { bottom: calc(44px + 64px + 12px); }
}
@media (max-width: 360px) {
  .mtc-k { height: 44px; }
  .mtc-screen { height: 116px; }
}
/* Short screens (phone in landscape, tiny viewports): compact layout so the
   whole keypad fits without scrolling. */
@media (max-height: 560px) {
  .mtc-head { padding-top: 3px; padding-bottom: 3px; }
  .mtc-x { width: 32px; height: 32px; }
  .mtc-sz { height: 32px; }
  .mtc-body { padding: 8px; }
  .mtc-screen { height: 90px; padding: 6px 10px 4px; }
  .mtc-hbtn { height: 24px; }
  .mtc-result { height: 34px; line-height: 34px; font-size: 1.5rem; }
  .mtc-result.mtc-md { font-size: 1.25rem; }
  .mtc-result.mtc-sm { font-size: 1.05rem; }
  .mtc-result.mtc-xs { font-size: 0.9rem; }
  .mtc-keys { gap: 6px; margin-top: 8px; }
  .mtc-k { height: 36px; font-size: 0.95rem; }
  .mtc-k.mtc-op { font-size: 1.1rem; }
  .mtc-k.mtc-eq { font-size: 1.15rem; }
}
@media (prefers-reduced-motion: reduce) {
  .mtc-fab, .mtc-drop, .mtc-drop-x, .mtc-k, .mtc-h-item { transition: none; }
  .mtc-fab.mtc-pop, .mtc-fab.mtc-ping::after, .mtc-win-in.mtc-pop { animation: none; }
}
@media print { .mtc-fab, .mtc-win, .mtc-drop { display: none !important; } }

<body>
<!-- Nothing below is shown until the login check passes -->
<div class="gate" id="gate">
 <div class="gatebox" id="gateBox">
  <div class="spinr"></div>
  <h2>Checking your login…</h2>
  <p>Please wait a moment.</p>
 </div>
</div>
<div class="wrap hidden" id="appWrap">
 <div class="authbar">
  <div class="who" id="whoBox"></div>
  <div class="authbtns"><button type="button" class="abtn out" id="logoutBtn"><span aria-hidden="true">⎋</span> Logout</button></div>
 </div>
 <div class="top"><div><h1>Garments Accounts</h1><p id="subtitle">Connecting to the shared database…</p></div><div class="status" id="status">Connecting…</div></div>
 <div class="tabbar" id="tabbar"></div>
 <div id="tab-summary" class="tabpanel"></div>
 <div id="tab-sales" class="tabpanel"></div>
 <div id="tab-expenses" class="tabpanel"></div>
 <div id="tab-stock" class="tabpanel"></div>
 <div id="tab-capital" class="tabpanel"></div>
 <div id="tab-inventory" class="tabpanel"></div>
 <div id="tab-settings" class="tabpanel"></div>
</div>
<!-- Reports & Export: Excel engine (used by the Excel report button in the Settings tab) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';"></script>
<script>
'use strict';
/* =====================================================================
   Garments Accounts — shared partner ledger
   Rules the numbers follow (so every screen agrees):
   • Profit counts an order only when it is Delivered, Returned or Lost.
   • Cost of goods = average buying price of the purchases made on or before the order date,
     so buying more stock later never rewrites earlier profit.
   • Pending = parcel already with the courier: it leaves the shelf (In Transit)
     and its courier fee is paid (cash), but revenue/COGS wait for delivery.
   • Returned: "With charge" = the customer paid the delivery charge (it counts as revenue and can be
     received as cash); "Without charge" = the customer did not pay it. Condition Good comes back to
     stock, Damaged is written off, Lost = the product never came back (written off).
   • Cash = capital in − withdrawals + money received − costs paid from the
     business account − repayments to partners.
   • A cost a partner paid personally does NOT touch business cash; it becomes
     "owed back" to that partner until a Reimbursement is recorded (Accounts tab).
   • A partner can take out at most: investment + share of profit (− share of loss)
     − what they already took — and never more than the cash in the business account.
   • Every order can name its Courier. The Accounts tab groups the customer money still to receive by courier
     (orders saved before couriers existed sit under "No courier set"); the groups always add up to
     Summary's "Customer money not yet received". Marking orders received from there uses the normal save path.
   ===================================================================== */
const KEYS=['sales','expenses','stock','capital'];
const BIZ='biz', BIZ_NAME='Business Account';
const DEFAULT_COURIERS=['Pathao','Steadfast','RedX'];
const NO_COURIER='__no_courier__';   // sentinel bucket for orders with no Courier set — never a real courier name a partner would type
const PLACEHOLDERS=['Partner 1','Partner 2','Partner 3'], REAL_NAMES=['Munan','Jeet','Riti'];
// Costs the app already counts by itself. They can never be an Expense category, or they would be counted twice:
//  product cost -> Stock tab (cash out when bought, profit cost when sold) · courier/return -> Sales order · damaged goods -> damaged returns
const RESERVED=[
 {re:/^(product|stock|inventory|goods|raw material)s?( (cost|purchase|buying))?s?$/,use:'the Stock tab'},
 {re:/^(courier|delivery)( (cost|charge|fee))?s?$|^return( (charge|cost|fee))?s?$/,use:'the Courier Fee / Return Fee fields on the Sales tab'},
 {re:/^loss\s*(&|and)\s*damage$|^damage(d)?( (goods|loss|return)s?)?$/,use:'damaged returns (choose Damaged on the return in the Sales tab)'}];
function reservedUse(name){const n=String(name||'').toLowerCase().replace(/\s+/g,' ').trim();const r=RESERVED.find(x=>x.re.test(n));return r?r.use:'';}

let db=null, activeTab='summary';
let S={
 partners:[{id:'p_munan',name:'Munan',share:33.33,legacy:[]},{id:'p_jeet',name:'Jeet',share:33.33,legacy:[]},{id:'p_riti',name:'Riti',share:33.34,legacy:[]}],
 categories:['Packaging','Marketing','Payment Charges','Transport (Fare)','Operations','Staff','Official / Legal','Others'],
 products:['Product A','Product B','Product C'],
 couriers:DEFAULT_COURIERS.slice(),
 dupOk:[]   // warnings a partner marked "Not a problem"
};
let state={sales:[],expenses:[],stock:[],capital:[]};
const editing={}, built={};
const sortBy={sales:'new',expenses:'new',stock:'new',capital:'new',cash:'new'};   // history sort choice per table (always starts on "Newest first")
const autoTouched={};   // date / time inputs a partner changed by hand: these are never auto-updated

/* ---------- small helpers ---------- */
const $=id=>document.getElementById(id);
const clone=o=>JSON.parse(JSON.stringify(o));   // db snapshots are read-only, so always work on copies
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function num(v){return +v||0;}
function money(n){const v=num(n);return (v<0?'−':'')+'৳'+Math.abs(v).toLocaleString('en-US',{maximumFractionDigits:2});}
function pad(n){return String(n).padStart(2,'0');}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}   // local date, not UTC
function nowTimeStr(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}   // local time, 24h "HH:MM" (stored that way)
function fmtTime(t){const m=/^(\d{1,2}):(\d{2})/.exec(String(t||''));if(!m)return '';const h=+m[1];return (h%12||12)+':'+m[2]+' '+(h>=12?'PM':'AM');}   // shown as 3:45 PM
function sum(arr,k){return arr.reduce((a,x)=>a+num(x[k]),0);}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'x';}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function isLocalId(id){return /^local_/.test(id)||/^l\d{12,}/.test(id);}
const st=r=>r.status||'Pending';
const norm=v=>String(v==null?'':v).trim().replace(/\s+/g,' ').toLowerCase();
/* ---------- history sorting (date + time; entries saved before time existed count as 00:00) ---------- */
const cmp=(a,b)=>a<b?-1:a>b?1:0;
const whenKey=r=>(r.date||'')+' '+(r.time||'00:00');
const byNewest=(a,b)=>cmp(whenKey(b),whenKey(a))||num(b.createdAt)-num(a.createdAt);
const SORT_LABELS=[['new','Newest first'],['old','Oldest first'],['amtHigh','Highest amount'],['amtLow','Lowest amount'],['qtyHigh','Highest quantity'],['qtyLow','Lowest quantity']];
const sortOpts=(hasQty,cur)=>SORT_LABELS.filter(([v])=>hasQty||!/^qty/.test(v)).map(([v,l])=>`<option value="${v}"${v===cur?' selected':''}>${l}</option>`).join('');
function sortRows(rows,mode,amt,qty){   // ties on amount / quantity fall back to newest first
 const by={
  new:byNewest,
  old:(a,b)=>byNewest(b,a),
  amtHigh:(a,b)=>amt(b)-amt(a)||byNewest(a,b),
  amtLow:(a,b)=>amt(a)-amt(b)||byNewest(a,b),
  qtyHigh:(a,b)=>qty(b)-qty(a)||byNewest(a,b),
  qtyLow:(a,b)=>qty(a)-qty(b)||byNewest(a,b)}[mode]||byNewest;
 return rows.slice().sort(by);
}   // "Polo", "polo " and "POLO" are the same thing

/* ---------- Backup & Export helpers ---------- */
function downloadBlob(content,mime,filename){
 const blob=new Blob([content],{type:mime});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();
 setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},0);
}
function csvEscape(v){
 let s=v==null?'':String(v);
 if(/^[=+\-@]/.test(s))s="'"+s;   // stop spreadsheet apps from treating a cell as a formula
 if(/[",\n]/.test(s))s='"'+s.replace(/"/g,'""')+'"';
 return s;
}
let toastTimer=null;
function showToast(msg,isError){
 let t=$('gatToast');
 if(!t){t=document.createElement('div');t.id='gatToast';t.className='toast';document.body.appendChild(t);}
 t.textContent=msg;t.className='toast show'+(isError?' err':'');
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.className='toast';},isError?4500:2600);
}
function yieldToUI(){return new Promise(r=>setTimeout(r,0));}

/* ---------- status pill + subtitle ---------- */
function setStatus(kind){
 const map={
  connecting:['Connecting…','Connecting to the shared database…'],
  synced:['Synced','Shared with all partners — live sync'],
  offline:['Offline','Offline — reconnect to load and save shared data'],
  error:['Sync problem','Sync problem — recent changes may not be saved'],
  denied:['No access','Your account is not allowed to use this page']};
 const m=map[kind]||map.connecting;
 $('status').textContent=m[0];$('subtitle').textContent=m[1];
}
function saveFailed(e){
 setStatus('error');
 const c=e&&e.code;
 const why=c==='invalid_argument'?'You may have view-only access to this page.'
  :c==='quota_exceeded'?'The shared database is full. Delete old entries first.'
  :c==='resource_exhausted'?'Too many requests — wait a moment and try again.'
  :'Check your internet connection and try again.';
 alert('Could not save to the shared database.\n'+why+'\nNothing was changed.');
}

/* ---------- local copy (works offline, refreshed on every sync) ---------- */
function saveLocal(){try{localStorage.setItem('gat_state',JSON.stringify(state));localStorage.setItem('gat_settings',JSON.stringify(S));}catch(e){}}
let cacheTimer=null;
function cacheLocal(){clearTimeout(cacheTimer);cacheTimer=setTimeout(saveLocal,400);}
function loadLocal(){try{
 const s=JSON.parse(localStorage.getItem('gat_state')||'{}');
 KEYS.forEach(k=>{if(Array.isArray(s[k]))state[k]=s[k];});
 const ss=JSON.parse(localStorage.getItem('gat_settings')||'null');
 if(ss&&typeof ss==='object')S=Object.assign(S,ss);
}catch(e){}}

/* ---------- partners: stable ids so renames never break history ---------- */
function normalizeSettings(){
 const list=Array.isArray(S.partners)?S.partners:[];
 const oldFormat=list.some(p=>!p.id);
 const seen=new Set();
 S.partners=list.map((p,i)=>{
  const name=String(p.name||'').trim()||('Partner '+(i+1));
  const legacy=Array.isArray(p.legacy)?p.legacy.slice():(p.id?[]:[name]);   // names old records may still carry
  let id=p.id||('p_'+slug(name));const base=id;let n=2;
  while(seen.has(id))id=base+'_'+n++;
  seen.add(id);
  return {id,name,share:num(p.share),legacy};
 });
 // one-time: data saved by the old version still has the placeholder names
 if(oldFormat&&S.partners.length===3&&S.partners.every((p,i)=>p.name===PLACEHOLDERS[i]))S.partners.forEach((p,i)=>{p.name=REAL_NAMES[i];});
 S.categories=(Array.isArray(S.categories)?S.categories:[]).filter(c=>!reservedUse(c));
 S.products=Array.isArray(S.products)?S.products:[];
 S.couriers=Array.isArray(S.couriers)?S.couriers:DEFAULT_COURIERS.slice();   // old settings docs have no couriers list — fall back to the defaults
 S.dupOk=Array.isArray(S.dupOk)?S.dupOk:[];
}
function partnerById(id){return S.partners.find(p=>p.id===id)||null;}
function partnerByName(n){return S.partners.find(p=>p.name===n)||S.partners.find(p=>(p.legacy||[]).includes(n))||null;}
// who does a record point at?  -> {kind:'biz'} | {kind:'partner',p} | {kind:'unknown',name}
function payer(rec,idKey,nameKey){
 const id=rec[idKey],name=rec[nameKey];
 if(id===BIZ)return {kind:'biz'};
 if(id){const p=partnerById(id);return p?{kind:'partner',p}:{kind:'unknown',name:name||id};}
 if(!name||name===BIZ_NAME)return {kind:'biz'};
 const p=partnerByName(name);return p?{kind:'partner',p}:{kind:'unknown',name};
}
function payerLabel(pr){return pr.kind==='biz'?BIZ_NAME:pr.kind==='partner'?pr.p.name:(pr.name+' (removed)');}
function partnerUsage(id){
 let n=0;const hit=pr=>{if(pr.kind==='partner'&&pr.p.id===id)n++;};
 state.capital.forEach(c=>hit(payer(c,'partnerId','partner')));
 state.expenses.forEach(e=>hit(payer(e,'paidById','paidBy')));
 state.stock.forEach(s=>hit(payer(s,'paidById','paidBy')));
 state.sales.forEach(s=>hit(payer(s,'courierPaidById','courierPaidBy')));
 return n;
}

/* ---------- option lists ---------- */
function partnerOptions(){return S.partners.map(p=>({v:p.id,l:p.name}));}
function paidByOptions(){return [{v:BIZ,l:BIZ_NAME}].concat(partnerOptions());}
function productOptions(){return S.products.slice();}
function courierOptions(){return S.couriers.slice();}
function categoryOptions(){const c=S.categories.filter(x=>!reservedUse(x));return c.length?c:['Others'];}
function optList(f){return f.opts().map(o=>typeof o==='string'?{v:o,l:o}:o);}

/* ---------- tab definitions ---------- */
const statusCell=r=>{
 const s=st(r);const c=s==='Delivered'?'b-ok':(s==='Returned'||s==='Lost')?'b-bad':'b-soft';
 let sub='';
 if(s==='Returned'){const bits=[r.returnCond&&r.returnCond!=='—'?r.returnCond:'condition not set'];if(r.returnMode)bits.push(r.returnMode.toLowerCase());if(num(r.returnCharge))bits.push('return fee '+money(r.returnCharge));sub=`<span class="sub">${esc(bits.join(' · '))}</span>`;}
 return `<span class="badge ${c}">${esc(s)}</span>${sub}`;
};
const TYPE_LABEL={Investment:'Investment',Withdrawal:'Withdrawal',Reimbursement:'Bills repaid'};
const dateCell=r=>esc(r.date)+(r.time?`<span class="sub">${esc(fmtTime(r.time))}</span>`:'');
// Time is picked automatically (current time) but can be changed. It is required, except when editing an older entry that was saved before time existed.
const timeField=key=>({key:'time',label:'Time',type:'time',req:()=>{const id=editing[key],old=id&&state[key].find(r=>r.id===id);return !(old&&!old.time);}});
const codOf=r=>num(r.qty)*num(r.unitPrice)+num(r.deliveryCharge);
const collects=r=>st(r)==='Delivered'||(st(r)==='Returned'&&r.returnMode==='With charge');   // orders where the customer pays us: COD on delivery, or the delivery charge on a "With charge" return
const dueOf=r=>st(r)==='Delivered'?codOf(r):(collects(r)?num(r.deliveryCharge):0);   // how much the customer pays us on this order
const TAB_CONFIGS={
 sales:{title:'Sales',single:'Sale',amount:r=>num(r.qty)*num(r.unitPrice),qty:r=>num(r.qty),fields:[
  {key:'date',label:'Date',type:'date',req:true},timeField('sales'),
  {key:'orderNo',label:'Order No',type:'text',ph:'ORD-001',req:true},
  {key:'customerName',old:'customer',label:'Customer Name',type:'text',wide:true},
  {key:'customerPhone',label:'Phone',type:'tel'},
  {key:'customerAddress',label:'Address',type:'text',wide:true},
  {key:'note',label:'Note',type:'text',wide:true},
  {key:'product',label:'Product',type:'select',opts:productOptions,req:true,emptyMsg:'Add a product in Settings first'},
  {key:'qty',label:'Qty',type:'number',step:1,int:true,req:true},
  {key:'unitPrice',label:'Unit Price',type:'number',req:true},
  {key:'deliveryCharge',label:'Delivery Charge',type:'number'},
  {key:'courier',label:'Courier',type:'select',opts:courierOptions,blank:'Select…',emptyMsg:'Add a courier in Settings first',req:()=>{const id=editing.sales,old=id&&state.sales.find(r=>r.id===id);return !(old&&!old.courier);}},
  {key:'courierCharge',label:'Courier Fee',type:'number'},

/* ---------- forms (ids are unique per tab: in_<tab>_<field>) ---------- */
const fid=(key,f)=>'in_'+key+'_'+f.key;
function fieldInput(key,f){
 const id=fid(key,f);
 if(f.type==='select')return `<select id="${id}"></select>`;
 if(f.type==='date')return `<input type="date" id="${id}" value="${todayStr()}">`;
 if(f.type==='time')return `<input type="time" id="${id}" value="${nowTimeStr()}">`;
 const isNum=f.type==='number';
 return `<input type="${f.type}" id="${id}" ${isNum?`step="${f.step||0.01}" min="0" inputmode="${f.step===1?'numeric':'decimal'}"`:''} placeholder="${esc(f.ph||'')}">`;
}
function fillSelect(el,f,wanted){
 const cur=wanted!==undefined?wanted:el.value;
 const opts=optList(f);
 el.innerHTML=opts.length===0&&f.emptyMsg?`<option value="">${esc(f.emptyMsg)}</option>`
  :(f.blank?`<option value="">${esc(f.blank)}</option>`:'')+opts.map(o=>`<option value="${esc(o.v)}">${esc(o.l)}</option>`).join('');
 if(cur&&[...el.options].some(o=>o.value===cur))el.value=cur;
 else if(cur){   // chosen value was removed from Settings — keep it visible instead of silently switching
  el.insertAdjacentHTML('afterbegin',`<option value="${esc(cur)}">${esc(f.nameKey?'Removed partner':cur)} (removed)</option>`);el.value=cur;}
}
function refreshSelects(key){
 TAB_CONFIGS[key].fields.forEach(f=>{if(f.type==='select'){const el=$(fid(key,f));if(el)fillSelect(el,f);}});
 applyShowIf(key);
}
function applyShowIf(key){
 const cfg=TAB_CONFIGS[key],d={};
 cfg.fields.forEach(f=>{const el=$(fid(key,f));d[f.key]=el?el.value:'';});
 cfg.fields.forEach(f=>{if(f.showIf){const w=$('fw_'+key+'_'+f.key);if(w)w.classList.toggle('hidden',!f.showIf(d));}});
 if(key==='capital')updateCapitalHint();
}
function collectForm(key){
 const cfg=TAB_CONFIGS[key],d={};
 cfg.fields.forEach(f=>{
  const el=$(fid(key,f));
  d[f.key]=f.type==='number'?(parseFloat(el.value)||0):((f.type==='text'||f.type==='tel')?el.value.trim():el.value);
  if(f.type==='select'&&f.nameKey)d[f.nameKey]=el.value&&el.selectedOptions[0]?el.selectedOptions[0].textContent:'';
 });
 // fields that don't apply to this status are stored empty, so they can never leak into the totals
 cfg.fields.forEach(f=>{if(f.showIf&&!f.showIf(d))d[f.key]=f.def!==undefined?f.def:(f.type==='number'?0:'');});
 return d;
}
function validate(key,d){
 for(const f of TAB_CONFIGS[key].fields){
  if(f.showIf&&!f.showIf(d))continue;
  const need=typeof f.req==='function'?f.req(d):f.req,v=d[f.key];
  if(f.type==='select'&&f.emptyMsg&&optList(f).length===0&&need&&!String(v??'').trim()){alert(f.emptyMsg+'.');return false;}   // an empty list only blocks a required field with nothing chosen (an old order without a courier can still be edited)
  if(need){const bad=f.type==='number'?!(v>0):!String(v??'').trim();if(bad){alert('Please fill in: '+f.label);return false;}}
  if(f.type==='number'){
   if(v<0){alert(f.label+' cannot be negative.');return false;}
   if(f.int&&!Number.isInteger(v)){alert(f.label+' must be a whole number.');return false;}
  }
  if(f.nameKey&&v!==BIZ&&!partnerById(v)){alert('Please choose: '+f.label);return false;}
 }
 return true;
}
function loadIntoForm(key,rec){
 TAB_CONFIGS[key].fields.forEach(f=>{
  const el=$(fid(key,f));if(!el)return;
  if(f.type==='select'){
   if(f.nameKey){   // older records stored only a name — map it to a partner
    let pr=payer(rec,f.key,f.nameKey);
    if(f.noBiz&&pr.kind==='biz')pr={kind:'unknown',name:'not set'};
    fillSelect(el,f,pr.kind==='biz'?BIZ:pr.kind==='partner'?pr.p.id:'');
    if(pr.kind==='unknown'){el.insertAdjacentHTML('afterbegin',`<option value="">Choose… (was: ${esc(pr.name)})</option>`);el.value='';}
   }else{let w=rec[f.key];if(w==null||w==='—')w='';fillSelect(el,f,String(w));}
  }else if(f.type==='date'){el.value=rec[f.key]||todayStr();if(f.key==='date')autoTouched[el.id]=true;}   // while editing, the saved date/time stay as they are
  else if(f.type==='time'){el.value=rec[f.key]||'';autoTouched[el.id]=true;}
  else if(f.type==='number')el.value=num(rec[f.key])?rec[f.key]:'';
  else el.value=rec[f.key]||(f.old&&rec[f.old])||'';
 });
 applyShowIf(key);
}
function clearForm(key,keepSelects){
 TAB_CONFIGS[key].fields.forEach(f=>{
  const el=$(fid(key,f));if(!el)return;
  if(f.type==='date'){el.value=todayStr();delete autoTouched[el.id];}
  else if(f.type==='time'){el.value=nowTimeStr();delete autoTouched[el.id];}
  else if(f.type==='select'){if(!keepSelects){fillSelect(el,f,'');el.selectedIndex=0;}}
  else el.value='';
 });
 applyShowIf(key);
}
function updateFormMode(key){
 const cfg=TAB_CONFIGS[key],ed=!!editing[key];
 $('h_'+key).textContent=ed?(cfg.editTitle||'Edit '+cfg.single):(cfg.addTitle||'Add '+cfg.single);
 $('addbtn_'+key).textContent=ed?'Save changes':(cfg.addBtn||'+ Add '+cfg.single);
 $('cancel_'+key).classList.toggle('hidden',!ed);
}

function refreshAutoStamp(){   // date + time follow the clock until a partner changes them by hand (never while editing or while the field is focused)
 KEYS.forEach(key=>{
  if(!built[key]||editing[key])return;
  [['date',todayStr],['time',nowTimeStr]].forEach(([k,now])=>{
   const id='in_'+key+'_'+k,el=$(id),v=now();
   if(el&&!autoTouched[id]&&document.activeElement!==el&&el.value!==v)el.value=v;
  });
 });

function startEdit(key,id){

function availableStock(product,skipSaleId){const i=computeInventory(skipSaleId).find(x=>norm(x.product)===norm(product));return i?i.inStock:0;}
function confirmRisky(key,d){
 const dup=key==='sales'?null:sameEntry(key,d,editing[key]);   // sales have their own order-number check below
 if(dup&&!confirm(`An identical ${DUP_LABEL[key]} is already saved (${dupText(key,dup)}).\n\nIf this is the same entry, adding it again counts it twice.\n\nAdd it anyway?`))return false;
 if(key==='expenses'){
  const use=reservedUse(d.category);
  if(use){alert(`"${d.category}" is already counted automatically through ${use}.\n\nEnter it there — adding it here would count it twice.`);return false;}
  const why=expenseIssue(d,true);
  if(why&&!confirm(`This expense may already be counted somewhere else: ${why}.\n\nProduct cost is counted from Stock only, and courier, return and damage costs from the Sales tab — adding it here can count it twice.\n\nAdd it as an expense anyway?`))return false;
  const im=investMsg(d.paidById,num(d.amount));
  if(im&&!confirm(`${im}\n\nSave it anyway?`))return false;
 }
 if(key==='stock'){
  const twin=expenseTwin(d);
  if(twin&&!confirm(`This purchase looks like an expense that is already entered (${twin}).\n\nProduct cost should be entered once — here in Stock. If that expense is the same purchase, delete it from Expenses first, otherwise it is counted twice.\n\nAdd it anyway?`))return false;
  const im=investMsg(d.paidById,stockTotal(d));
  if(im&&!confirm(`${im}\n\nSave it anyway?`))return false;
 }
 if(key==='sales'){
  const same=d.orderNo?state.sales.filter(s=>s.id!==editing.sales&&norm(s.orderNo)===norm(d.orderNo)):[];
  if(same.length){
   const exact=same.some(s=>DUP_SIG.sales(s)===DUP_SIG.sales(d));
   const courier=num(d.courierCharge)>0&&same.some(s=>num(s.courierCharge)>0);
   const lines=same.slice(0,3).map(s=>`• ${s.product} × ${s.qty} at ${money(s.unitPrice)} (${s.date})`).join('\n');
   const msg=`Order ${d.orderNo} is already in Sales:\n${lines}\n\n`
    +(exact?'This line has the same product, quantity and price, so it looks like a duplicate — revenue, product cost and courier would all be counted twice.':'If this is another product in the same order, that is fine.')
    +(courier?'\n\nThat order already has a courier fee — enter it once per parcel, or it is counted twice.':'')
    +'\n\nAdd it anyway?';
   if(!confirm(msg))return false;
  }
  const need=(d.status==='Returned'&&d.returnCond==='Good')?0:d.qty;
  const have=availableStock(d.product,editing.sales);
  if(need>0&&have-need<0&&!confirm(`Only ${have} unit(s) of ${d.product} in stock, but this order needs ${need}.\n\nAdd it anyway?`))return false;
 }
 if(key==='capital'){
  const who=(partnerById(d.partnerId)||{}).name||'This partner';
  if(d.type==='Investment'){
   const t=personalTwin(d.partnerId,d.amount);
   if(t&&!confirm(`${who} also paid ${t} personally.\n\nIf this Investment is the same money, ${who} is credited twice — once as a bill owed back and again as capital.\n\nSave it anyway?`))return false;
  }
  if(d.type==='Withdrawal'){
   const owed=computeSummary(state.capital.filter(r=>r.id!==editing.capital)).owed[d.partnerId]||0;
   if(owed>0.005&&Math.abs(owed-d.amount)<0.005&&!confirm(`This is exactly the ${money(owed)} that ${who} is owed for bills paid personally.\n\nIf you are paying those bills back, cancel and use "Repay bills" — a Withdrawal lowers their profit balance but leaves the bills owed, so they would be paid twice.\n\nSave it as a Withdrawal anyway?`))return false;
  }
 }
 return true;
}
async function addTabRecord(key){
 const btn=$('addbtn_'+key);if(btn.disabled)return;
 refreshAutoStamp();   // an untouched date/time is stamped with the moment of saving
 const d=collectForm(key);
 if(!validate(key,d)||!confirmRisky(key,d))return;
 if(key==='capital'&&!guardCapital(state.capital.filter(r=>r.id!==editing.capital).concat([Object.assign({},d,{id:editing.capital||'__new'})])))return;
 btn.disabled=true;
 try{
  const editId=editing[key];let ok;
  if(editId){const old=state[key].find(r=>r.id===editId);d.createdAt=(old&&old.createdAt)||Date.now();stampEdit(d,old);ok=await updateRecord(key,editId,d);}
  else{d.createdAt=Date.now();stampNew(d);ok=await addRecord(key,d);}
  if(ok){editing[key]=null;clearForm(key,!editId);updateFormMode(key);refreshActive();}
 }finally{btn.disabled=false;}
}

/* ---------- saving: shared db when available, this device otherwise. Failures are never silent. ---------- */
async function addRecord(key,data){
 if(db){try{await db.collection(key).add(clone(data));setStatus('synced');return true;}catch(e){saveFailed(e);return false;}}
 state[key].push(Object.assign({id:'local_'+uid()},clone(data)));saveLocal();refreshActive();return true;
}
async function updateRecord(key,id,data,quiet){   // quiet = the caller lists failures itself (batch receive), so no pop-up per record
 if(db&&!isLocalId(id)){try{await db.collection(key).doc(id).set(clone(data));setStatus('synced');return true;}catch(e){if(quiet){setStatus('error');return false;}saveFailed(e);return false;}}
 const i=state[key].findIndex(r=>r.id===id);if(i<0)return false;
 state[key][i]=Object.assign({id},clone(data));saveLocal();refreshActive();return true;
}
async function delRecord(key,id){
 if(key==='capital'&&!guardCapital(state.capital.filter(r=>r.id!==id)))return;
 if(!confirm('Delete this entry?\nIt will disappear for every partner and cannot be undone.'))return;
 if(db&&!isLocalId(id)){try{await db.collection(key).doc(id).delete();setStatus('synced');}catch(e){saveFailed(e);return;}}
 else{state[key]=state[key].filter(r=>r.id!==id);saveLocal();}
 if(editing[key]===id){editing[key]=null;clearForm(key,false);updateFormMode(key);}
 refreshActive();
}
let settingsQueue=Promise.resolve();   // one settings write at a time
function commitSettings(mutator){
 const run=async()=>{
  const next=clone(S);
  if(mutator(next)===false)return false;
  if(db){try{await db.doc('settings/main').set(next);setStatus('synced');}catch(e){saveFailed(e);return false;}}
  S=next;normalizeSettings();if(!db)saveLocal();
  refreshActive();return true;
 };
 const p=settingsQueue.then(run);settingsQueue=p.catch(()=>{});return p;
}
async function uploadOfflineRecords(){   // entries typed while offline are pushed once the shared db is reachable
 for(const key of KEYS){
  for(const r of state[key].filter(x=>isLocalId(x.id))){
   const data=clone(r);delete data.id;
   try{await db.collection(key).add(data);}catch(e){saveFailed(e);return;}   // entries not sent yet stay on this device (see the snapshot handler)
   state[key]=state[key].filter(x=>x.id!==r.id);saveLocal();   // saved right away, so closing the tab can never upload the same entry twice
  }
 }
}

/* ---------- calculations ---------- */
function costAt(stk,date,fallback){   // average buying price of the purchases made on or before `date`: buying more stock later never rewrites older profit
 let q=0,t=0;
 stk.forEach(x=>{if((x.date||'')<=(date||'')){q+=num(x.qty);t+=num(x.qty)*num(x.buyingPrice);}});
 return q>0?t/q:fallback;   // sale entered before any purchase: use the overall average
}
function inPeriod(dateStr,period){   // true when the (order/expense) date falls inside {from,to}; no period, or a blank bound, = no limit on that side
 if(!period)return true;
 const d=dateStr||'';
 if(period.from&&d<period.from)return false;
 if(period.to&&d>period.to)return false;
 return true;
}
function computeInventory(skipSaleId,period){   // period (optional {from,to}) scopes which SALES count, by order date. Buying history (stk / avgCost) is never scoped, so a sale's cost is still today's same average-cost-on-order-date rule either way.
 const names=[],seen=new Set();
 const add=n=>{if(n===undefined||n===null||n==='')return;const k=norm(n);if(!seen.has(k)){seen.add(k);names.push(n);}};   // "Polo" and "polo" are one product
 S.products.forEach(add);state.stock.forEach(s=>add(s.product));state.sales.forEach(s=>add(s.product));   // removed products keep counting
 const sales=state.sales.filter(s=>s.id!==skipSaleId&&inPeriod(s.date,period));
 return names.map(p=>{
  const k=norm(p);

function computeSummary(capitalList,period){   // capitalList lets us test "what if this entry changed?"; period (optional {from,to}) scopes Revenue/Costs/Orders/Expenses-by-category by order/expense date. Cash, Stock and Partners' capital/paid/owed below are always all-time, whatever `period` is.

 const invScoped=period?computeInventory(undefined,period):inv;   // same average-cost-on-order-date rule; only which orders are counted changes
 const salesAll=state.sales,pendingAll=salesAll.filter(s=>st(s)==='Pending');
 const salesScoped=period?salesAll.filter(s=>inPeriod(s.date,period)):salesAll;
 const delivered=salesScoped.filter(s=>st(s)==='Delivered'),returned=salesScoped.filter(s=>st(s)==='Returned'),pending=salesScoped.filter(s=>st(s)==='Pending'),lostOrders=salesScoped.filter(s=>st(s)==='Lost');
 // profit & loss — only orders that are finished (Delivered / Returned / Lost); counted by order date when a period is set
 const productSales=delivered.reduce((a,s)=>a+num(s.qty)*num(s.unitPrice),0);
 const deliveryCollected=sum(delivered,'deliveryCharge')+sum(returned.filter(s=>s.returnMode==='With charge'),'deliveryCharge');   // a returned order still earns the delivery charge when the customer paid it
 const revenue=productSales+deliveryCollected,cogs=sum(invScoped,'cogs'),damageLoss=sum(invScoped,'damageLoss'),lostLoss=sum(invScoped,'lostLoss');
 const grossProfit=revenue-cogs-damageLoss-lostLoss;
 const courierResolved=sum(delivered,'courierCharge')+sum(returned,'courierCharge')+sum(lostOrders,'courierCharge');
 const returnCharges=sum(returned,'returnCharge');
 const expensesScoped=period?state.expenses.filter(e=>inPeriod(e.date,period)):state.expenses;   // by expense date
 const operatingExpenses=sum(expensesScoped,'amount');
 const totalCosts=cogs+damageLoss+lostLoss+courierResolved+returnCharges+operatingExpenses;
 const netProfit=revenue-totalCosts;
 const decided=delivered.length+returned.length,returnRate=decided?returned.length/decided:0;
 // money still to come in / stock — always as of today, never scoped to a period
 const collectible=salesAll.filter(s=>collects(s));
 const moneyReceived=collectible.filter(s=>s.received==='Yes').reduce((a,s)=>a+dueOf(s),0);
 const moneyPending=collectible.filter(s=>s.received!=='Yes').reduce((a,s)=>a+dueOf(s),0);
 const codPending=pendingAll.reduce((a,s)=>a+codOf(s),0);
 const stockPurchases=sum(inv,'totalPurchaseCost'),stockValue=sum(inv,'stockValue'),transitValue=sum(inv,'transitValue');
 const courierAll=sum(salesAll,'courierCharge');   // paid to the courier when dispatched, pending orders included
 // who paid what — always all-time, never scoped
 const paidPersonally={},capitalByPartner={},repaid={},invested={},withdrawn={};
 S.partners.forEach(p=>{paidPersonally[p.id]=0;capitalByPartner[p.id]=0;repaid[p.id]=0;invested[p.id]=0;withdrawn[p.id]=0;});
 const unmatched={paid:0,capital:0,repaid:0,count:0};
 let bizPaid=0;const bizBy={stock:0,expenses:0,courier:0};

 state.expenses.forEach(e=>pay(payer(e,'paidById','paidBy'),num(e.amount),'expenses'));
 state.stock.forEach(s=>pay(payer(s,'paidById','paidBy'),num(s.qty)*num(s.buyingPrice),'stock'));
 salesAll.forEach(s=>pay(payer(s,'courierPaidById','courierPaidBy'),num(s.courierCharge)+(st(s)==='Returned'?num(s.returnCharge):0),'courier'));

 (capitalList||state.capital).forEach(c=>{
  const a=num(c.amount),pr=payer(c,'partnerId','partner'),p=pr.kind==='partner'?pr.p:null;

  else if(c.type==='Withdrawal'){withdrawnTotal+=a;if(p){withdrawn[p.id]+=a;capitalByPartner[p.id]-=a;}else{unmatched.capital-=a;unmatched.count++;}}
  else{investedTotal+=a;if(p){invested[p.id]+=a;capitalByPartner[p.id]+=a;}else{unmatched.capital+=a;unmatched.count++;}}

 const paidPersonallyTotal=Object.values(paidPersonally).reduce((a,x)=>a+x,0)+unmatched.paid;

  const profitShare=netProfit*num(p.share)/100;
  const entitlement=invested[p.id]-withdrawn[p.id]+profitShare;

 const warnings=inventoryWarnings(inv).concat(duplicateWarnings());
 if(Math.abs(shareTotal-100)>0.005)warnings.push(`Profit shares add up to ${shareTotal.toFixed(2)}%, not 100%. Fix this in Settings.`);

 if(cashBalance<-0.005)warnings.push(`Cash in the business account is negative (${money(cashBalance)}): more money has gone out than came in. Check recent withdrawals and entries.`);
 S.partners.forEach(p=>{const a=acct[p.id];if(a.withdrawn>0.005&&a.entitlement<-0.005)warnings.push(`<b>${esc(p.name)}</b> has taken ${money(-a.entitlement)} more than investment + profit share.`);});

  deliveredCount:delivered.length,returnedCount:returned.length,pendingCount:pending.length,lostCount:lostOrders.length,totalOrders:salesScoped.length,returnRate,

/* ---------- double-entry checks ---------- */
const stockTotal=s=>num(s.qty)*num(s.buyingPrice);
const okSig=sig=>(S.dupOk||[]).includes(sig);   // warnings a partner has marked "Not a problem"
const okBtn=sig=>` <button type="button" class="minibtn" data-act="dupOk" data-sig="${esc(sig)}">Not a problem</button>`;
const COST_WORDS=/\b(courier|pathao|steadfast|redx|paperfly|sundarban|delivery|parcel|returns?|returned|damage[sd]?)\b/i;   // costs the Sales tab already counts
const partnerKey=(r,idKey,nameKey)=>{const pr=payer(r,idKey,nameKey);return pr.kind==='partner'?pr.p.id:pr.kind==='biz'?BIZ:'x:'+norm(pr.name);};

const stockDesc=s=>`${s.product}: ${s.qty} × ${money(s.buyingPrice)} = ${money(stockTotal(s))} on ${s.date}`;
function stockTwin(e){return state.stock.find(s=>sameMoney(stockTotal(s),s.date,num(e.amount),e.date))||null;}   // a purchase this expense may be the same money as
function expenseIssue(e,withNames){   // why might this expense already be counted somewhere else? ('' = looks fine)
 const hit=stockTwin(e);
 if(hit)return 'it looks like the stock purchase '+stockDesc(hit);
 const text=(String(e.item||'')+' '+String(e.note||'')).trim();
 const w=text.match(COST_WORDS);
 if(w)return 'the details mention "'+w[0]+'" — courier, return and damage costs are counted from the Sales tab';
 if(/\b(stock|product cost)\b/i.test(text))return 'the details mention stock / product cost';
 if(withNames){
  const names=Array.from(new Set(S.products.concat(state.stock.map(s=>s.product)))).filter(n=>n&&String(n).length>=3);
  const pn=names.find(n=>norm(text).includes(norm(n)));
  if(pn)return 'the details mention the product "'+pn+'"';

}
function personalTwin(pid,amt){   // a bill this partner paid personally for exactly this amount ('' = none)
 const mine=(r,idKey,nameKey)=>{const p=payer(r,idKey,nameKey);return p.kind==='partner'&&p.p.id===pid;};
 const e=state.expenses.find(x=>mine(x,'paidById','paidBy')&&Math.abs(num(x.amount)-amt)<0.005);
 if(e)return `the expense "${e.item}" (${money(e.amount)})`;
 const s=state.stock.find(x=>mine(x,'paidById','paidBy')&&Math.abs(stockTotal(x)-amt)<0.005);

function investMsg(pid,amt){   // a bill paid personally must not also be an Investment for the same money

function expenseTwin(s){   // does this stock purchase look like an expense already entered?

let summaryPeriod={mode:'all',from:'',to:''};
let summaryShellBuilt=false;
const MONTH_NAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthBounds(y,m){   // m is 0-indexed; returns the calendar month as {from,to} date strings
 const from=y+'-'+pad(m+1)+'-01';

}
function monthLabel(y,m){return MONTH_NAMES[m]+' '+String(y).slice(2);}
function resolveSummaryPeriod(p){   // -> {from,to,label} (from/to=null means no bound) or {error}
 const d=new Date();
 if(p.mode==='this'){const{from,to}=monthBounds(d.getFullYear(),d.getMonth());return{from,to,label:'This month ('+from+' to '+to+')'};}
 if(p.mode==='last'){let y=d.getFullYear(),m=d.getMonth()-1;if(m<0){m=11;y--;}const{from,to}=monthBounds(y,m);return{from,to,label:'Last month ('+from+' to '+to+')'};}
 if(p.mode==='custom'){
  const from=p.from||'',to=p.to||'';
  if(from&&to&&from>to)return{error:'The "From" date is after the "To" date — pick a valid range.'};
  if(!from&&!to)return{from:null,to:null,label:'Custom (no dates picked yet — showing all time)'};
  return{from:from||null,to:to||null,label:'Custom ('+(from||'start')+' to '+(to||'today')+')'};

}
function summaryMonthRange(){   // last 12 calendar months or fewer, capped to when sales/expenses actually start
 const d=new Date(),curY=d.getFullYear(),curM=d.getMonth();
 let startY=curY,startM=curM-11;while(startM<0){startM+=12;startY--;}
 const dates=[];
 state.sales.forEach(s=>{if(s.date)dates.push(s.date);});
 state.expenses.forEach(e=>{if(e.date)dates.push(e.date);});
 if(dates.length){
  const earliest=dates.reduce((a,b)=>a<b?a:b),ey=+earliest.slice(0,4),em=+earliest.slice(5,7)-1;
  if(ey>startY||(ey===startY&&em>startM)){startY=ey;startM=em;}
 }
 const out=[];let y=startY,m=startM;
 while(y<curY||(y===curY&&m<=curM)){out.push({y,m});m++;if(m>11){m=0;y++;}}

function renderMonthlyProfitChart(){   // dependency-free inline SVG bar chart; always all-time, never affected by summaryPeriod

 const maxAbs=Math.max(1,...vals.map(v=>Math.abs(v.net)));

 const zeroY=padT+plotH/2,scale=(plotH/2-6)/maxAbs;

 let bars='';
 vals.forEach((v,i)=>{
  const x=padL+i*(barW+gap),h=Math.max(1,Math.abs(v.net)*scale),y=v.net>=0?zeroY-h:zeroY;
  const color=v.net>0?'var(--accent2)':v.net<0?'var(--danger)':'var(--text-soft)';
  bars+=`<rect x="${x}" y="${y.toFixed(1)}" width="${barW}" height="${h.toFixed(1)}" rx="3" fill="${color}"><title>${esc(monthLabel(v.y,v.m))}: ${esc(money(v.net))}</title></rect>`;
  bars+=`<text x="${x+barW/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--text-soft)">${esc(monthLabel(v.y,v.m))}</text>`;
 });
 bars+=`<line x1="${padL-4}" y1="${zeroY.toFixed(1)}" x2="${(W-padR+4).toFixed(1)}" y2="${zeroY.toFixed(1)}" stroke="var(--card-border)"/>`;
 return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Net profit by month">${bars}</svg>`;
}

function cashLedger(){   // every movement of business cash, oldest first, with a running balance
 const rows=[];
 const add=(date,time,created,label,inn,out)=>{if(inn||out)rows.push({date:date||'',time:time||'',createdAt:num(created),label,inn,out});};
 state.capital.forEach(c=>{
  const pr=payer(c,'partnerId','partner'),name=pr.kind==='partner'?pr.p.name:(pr.kind==='unknown'?pr.name:'—'),a=num(c.amount);
  if(c.type==='Reimbursement')add(c.date,c.time,c.createdAt,'Bills repaid to '+name,0,a);
  else if(c.type==='Withdrawal')add(c.date,c.time,c.createdAt,'Withdrawal by '+name,0,a);
  else add(c.date,c.time,c.createdAt,'Investment by '+name,a,0);
 });
 state.sales.forEach(s=>{
  if(collects(s)&&s.received==='Yes')add(s.receivedDate||s.date,s.receivedDate?'':s.time,s.createdAt,st(s)==='Delivered'?'Order '+s.orderNo+' received':'Order '+s.orderNo+' delivery charge (returned)',dueOf(s),0);   // older entries have no received date: they keep the order date
  if(payer(s,'courierPaidById','courierPaidBy').kind==='biz')add(s.date,s.time,s.createdAt,'Courier / return — '+s.orderNo,0,num(s.courierCharge)+(st(s)==='Returned'?num(s.returnCharge):0));
 });
 state.stock.forEach(s=>{if(payer(s,'paidById','paidBy').kind==='biz')add(s.date,s.time,s.createdAt,'Stock: '+s.product+' × '+s.qty,0,num(s.qty)*num(s.buyingPrice));});
 state.expenses.forEach(e=>{if(payer(e,'paidById','paidBy').kind==='biz')add(e.date,e.time,e.createdAt,'Expense: '+e.item+' ('+e.category+')',0,num(e.amount));});
 rows.sort((a,b)=>cmp(whenKey(a),whenKey(b))||a.createdAt-b.createdAt);
 let bal=0;rows.forEach(r=>{bal+=r.inn-r.out;r.bal=bal;});
 return rows;
}

/* ---------- Accounts tab: money to collect from couriers ---------- */
/* Every order lands in exactly ONE bucket: its courier's name, or "No courier set" (orders saved before the Courier field existed).
   Each bucket uses the same collects()/dueOf() rule as Summary, so the buckets always add up to Summary's
   "Customer money not yet received" and "Pending orders (COD value)". */
function courierBuckets(){   // every courier currently in Settings, plus any that only appear on saved orders (renamed/removed since) — 'No courier set' is added separately by the caller
 const seen=new Set(),list=[];
 S.couriers.forEach(c=>{if(c&&!seen.has(c)){seen.add(c);list.push(c);}});
 state.sales.forEach(s=>{if(s.courier&&!seen.has(s.courier)){seen.add(s.courier);list.push(s.courier);}});
 return list;
}
const courierOf=s=>s.courier||NO_COURIER;   // which bucket a sale belongs to
const courierLabel=b=>b===NO_COURIER?'No courier set':b;
function courierOrdersFor(bucket){   // this courier's orders that still owe money — same rule as Summary's "Customer money not yet received"
 return state.sales.filter(s=>collects(s)&&s.received!=='Yes'&&courierOf(s)===bucket);
}
function courierMoneyPending(bucket){return courierOrdersFor(bucket).reduce((a,s)=>a+dueOf(s),0);}
function courierPendingCodValue(bucket){return state.sales.filter(s=>st(s)==='Pending'&&courierOf(s)===bucket).reduce((a,s)=>a+codOf(s),0);}

let courierBatch={open:null,date:todayStr(),selected:new Set(),failed:[],busy:false};   // JS-only state, same reasoning as the Summary period filter
let courierBlockBuilt=false,courierPanelBuiltFor=null;

 courierBlockBuilt=true;
}

 if(!orders.length){list.innerHTML=`<div class="empty">All caught up — nothing pending from this courier.</div>${failHtml}`;return;}
 // checkboxes carry .sortsel only to reset the global input{width:100%} rule (it would stretch them); no new CSS needed

 list.innerHTML=`<label class="kv-row kv-strong"><span><input type="checkbox" class="sortsel" data-act="cbSelectAll"${allChecked?' checked':''}${dis}> Select all</span><span>${orders.length} order${orders.length===1?'':'s'}</span></label>${rows}
  <button class="addbtn" data-act="cbReceive"${(!selOrders.length||courierBatch.busy)?' disabled':''}>${courierBatch.busy?'Saving…':'Mark '+selOrders.length+' order'+(selOrders.length===1?'':'s')+' received ('+money(selOrders.reduce((a,s)=>a+dueOf(s),0))+')'}</button>${failHtml}`;

function renderCourierBlock(){

 let totDue=0,totCod=0;
 const body=buckets.map(c=>{
  const due=courierMoneyPending(c),cod=courierPendingCodValue(c),open=courierBatch.open===c;
  totDue+=due;totCod+=cod;
  const gone=c!==NO_COURIER&&!inSettings.has(c);   // still on saved orders, but no longer in Settings
  return `<tr><td><button class="minibtn${open?' solid':''}" data-act="cbOpen" data-courier="${esc(c)}" aria-expanded="${open}">${esc(courierLabel(c))}</button>${gone?'<span class="sub">removed from Settings</span>':''}</td><td>${money(due)}</td><td>${money(cod)}</td></tr>`;
 }).join('');
 rows.innerHTML=body+`<tr class="total"><td>Total</td><td>${money(totDue)}</td><td>${money(totCod)}</td></tr>`;

async function batchReceiveCourier(){   // marks the ticked orders received through the normal save path (updateRecord + stampEdit), 5 at a time; the cash statement refreshes by itself once state changes
 const courier=courierBatch.open;if(!courier||courierBatch.busy)return;
 const orders=courierOrdersFor(courier).filter(s=>courierBatch.selected.has(s.id));
 if(!orders.length)return;
 const box=$('cbDateInput'),date=box?box.value:courierBatch.date;   // the date the person sees right now (a change event may not have fired yet)
 if(!date){alert('Please fill in: Received on');return;}
 courierBatch.date=date;
 const n=orders.length,total=orders.reduce((a,s)=>a+dueOf(s),0);
 if(!confirm(`Mark ${n} order${n===1?'':'s'} from ${courierLabel(courier)} as received on ${date}?\n\n${money(total)} will be added to the cash statement on that date.`))return;
 courierBatch.busy=true;courierBatch.failed=[];renderCourierOrderList();   // busy is set before the first await, so a double tap cannot start a second batch
 const failed=[],CHUNK=5;let saved=0;
 try{
  for(let i=0;i<orders.length;i+=CHUNK){
   await Promise.all(orders.slice(i,i+CHUNK).map(async s=>{
    const old=state.sales.find(r=>r.id===s.id),name=s.orderNo||s.id;
    if(!old||!collects(old)){failed.push(name);return;}   // deleted, or changed by another partner while this was open
    if(old.received==='Yes'){courierBatch.selected.delete(s.id);return;}   // another partner already marked it
    const d=clone(old);delete d.id;d.received='Yes';d.receivedDate=date;d.createdAt=old.createdAt||Date.now();stampEdit(d,old);
    if(await updateRecord('sales',s.id,d,true)){saved++;courierBatch.selected.delete(s.id);}else failed.push(name);
   }));
  }
 }finally{courierBatch.busy=false;courierBatch.failed=failed;}
 refreshActive();
 showToast(failed.length?`${failed.length} order${failed.length===1?'':'s'} could not be saved — see the list`:`${saved} order${saved===1?'':'s'} marked received`,failed.length>0);
}
function capitalLimit(){   // what may the selected partner do right now with this kind of entry?
 const pid=$('in_capital_partnerId').value,type=$('in_capital_type').value,p=partnerById(pid);
 if(!p)return null;
 const s=computeSummary(state.capital.filter(r=>r.id!==editing.capital)),a=s.acct[pid];
 let limit=null;
 if(type==='Withdrawal')limit=Math.max(0,Math.min(a.entitlement,s.cashBalance));
 else if(type==='Reimbursement')limit=Math.max(0,Math.min(a.owed,s.cashBalance));
 return {p,s,a,type,limit};
}

 const {p,s,a,type,limit}=L,amt=parseFloat($('in_capital_amount').value)||0;

 else if(type==='Reimbursement')text=`Business cash: <b>${money(s.cashBalance)}</b>. ${esc(p.name)} paid <b>${money(Math.max(0,a.owed))}</b> of business bills personally and has not been repaid. Repay up to <b>${money(limit)}</b> now.`;
 else text=`This adds money to the business account (cash now <b>${money(s.cashBalance)}</b>).`;
 const over=limit!==null&&amt>limit+0.005;
 box.className='limit'+(over?' bad':'');
 box.innerHTML=text+(over?'<br><b>This amount is more than allowed and will be blocked.</b>':'')+(limit>0?` <button type="button" class="minibtn" data-act="fillMax">Use ${money(limit)}</button>`:'');
}

}

 $('in_capital_partnerId').value=pid;$('in_capital_type').value=type;$('in_capital_amount').value='';

// would this list of partner-money entries overspend the cash or the partner's balance?
function capitalProblems(newCapital){
 const before=computeSummary(),after=computeSummary(newCapital),eps=0.005,msgs=[];
 if(after.cashBalance<-eps&&after.cashBalance<before.cashBalance-eps)
  msgs.push(`Not enough cash in the business account. Cash now: ${money(before.cashBalance)}; after this it would be ${money(after.cashBalance)}.`);
 S.partners.forEach(p=>{
  const a=before.acct[p.id],b=after.acct[p.id];
  if(b.withdrawn>eps&&b.entitlement<-eps&&b.entitlement<a.entitlement-eps)
   msgs.push(`${p.name} can only take ${money(a.canTake)} more (investment + profit share − loss − already withdrawn).`);
  if(b.owed<-eps&&b.owed<a.owed-eps)
   msgs.push(`${p.name} has only ${money(Math.max(0,a.owed))} of personally paid bills left to repay.`);
 });
 return msgs;
}
function guardCapital(list){

 alert('Not allowed:\n\n• '+m.join('\n• '));return false;
}

/* ---------- locks: lists unlock at once; profit shares need a wait; removing a partner needs a longer wait ---------- */
const SHARE_WAIT=5*60*1000,REMOVE_WAIT=10*60*1000,OPEN_WINDOW=10*60*1000;   // cooling-off waits, and how long an unlocked action stays available
let LOCKS={share:0,rm:{}},shareSig='';   // start times, kept on this device so a reload or a phone switching apps does not restart the wait
const listUnlocked={products:false,categories:false,couriers:false};
function loadLocks(){try{const x=JSON.parse(localStorage.getItem('gat_locks')||'null');if(x&&typeof x==='object')LOCKS={share:+x.share||0,rm:(x.rm&&typeof x.rm==='object')?x.rm:{}};}catch(e){}}
function saveLocks(){try{localStorage.setItem('gat_locks',JSON.stringify(LOCKS));}catch(e){}}
function gate(start,wait){   // s: 'off' (never started / expired) · 'wait' (left = ms until it opens) · 'open' (left = ms until it locks again)
 const now=Date.now(),t=+start||0;
 if(!t||now<t)return {s:'off'};
 if(now<t+wait)return {s:'wait',left:t+wait-now};
 if(now<t+wait+OPEN_WINDOW)return {s:'open',left:t+wait+OPEN_WINDOW-now};
 return {s:'off'};
}
const fmtLeft=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+pad(s%60);};
const shareOpen=()=>gate(LOCKS.share,SHARE_WAIT).s==='open';
function lockSig(){return gate(LOCKS.share,SHARE_WAIT).s+'|'+S.partners.map(p=>p.id+':'+gate(LOCKS.rm[p.id],REMOVE_WAIT).s).join(',');}
function renderShare(){
 const box=$('shareSection');if(!box)return;
 Object.keys(LOCKS.rm).forEach(id=>{if(!partnerById(id)||gate(LOCKS.rm[id],REMOVE_WAIT).s==='off')delete LOCKS.rm[id];});   // partner already gone, or the removal window ran out
 const g=gate(LOCKS.share,SHARE_WAIT),open=g.s==='open';
 const t=S.partners.reduce((a,p)=>a+num(p.share),0);
 const total=Math.abs(t-100)<=0.005?`Total share: ${t.toFixed(2)}%`:`<span class="amt expense">Total share: ${t.toFixed(2)}% — must add up to 100%</span>`;
 const btn=open?'<button class="lockbtn open" data-act="lockShare">🔓 Lock</button>':g.s==='wait'?'<button class="lockbtn" data-act="cancelShare">Cancel</button>':'<button class="lockbtn" data-act="unlockShare">🔒 Unlock</button>';
 const note=g.s==='wait'?`⏳ Editing opens in <b id="shareLeft">${fmtLeft(g.left)}</b> — this wait is here to stop hasty changes to profit shares.`
  :open?`🔓 Open for editing — locks again in <b id="shareLeft">${fmtLeft(g.left)}</b>.`
  :'🔒 Locked — tap Unlock; editing opens after a 5 minute wait.';
 const rows=!S.partners.length?'<div class="empty">No partners yet</div>'
  :open?S.partners.map(p=>`<div class="row end"><div class="field"><label for="pn_${esc(p.id)}">Name</label><input id="pn_${esc(p.id)}" value="${esc(p.name)}" data-act="pname" data-pid="${esc(p.id)}"></div><div class="field narrow"><label for="ps_${esc(p.id)}">Share %</label><input id="ps_${esc(p.id)}" type="number" step="0.01" min="0" value="${esc(p.share)}" data-act="pshare" data-pid="${esc(p.id)}"></div>${gate(LOCKS.rm[p.id],REMOVE_WAIT).s==='off'?`<button class="minibtn" data-act="rmStart" data-pid="${esc(p.id)}">Remove…</button>`:''}</div>`).join('')
  :kvRows(S.partners.map(p=>[esc(p.name),num(p.share).toFixed(2)+'%']));
 const pend=S.partners.map(p=>{
  const r=gate(LOCKS.rm[p.id],REMOVE_WAIT);
  if(r.s==='wait')return `<div class="lockmsg">⏳ Removing <b>${esc(p.name)}</b> is allowed in <b data-rmleft="${esc(p.id)}">${fmtLeft(r.left)}</b> <button class="minibtn" data-act="rmCancel" data-pid="${esc(p.id)}">Cancel</button></div>`;
  if(r.s==='open')return `<div class="lockmsg">Ready to remove <b>${esc(p.name)}</b> (available for <b data-rmleft="${esc(p.id)}">${fmtLeft(r.left)}</b>) <button class="minibtn solid danger" data-act="rmNow" data-pid="${esc(p.id)}">Remove now</button> <button class="minibtn" data-act="rmCancel" data-pid="${esc(p.id)}">Cancel</button></div>`;
  return '';
 }).join('');
 const add=open?`<div class="row"><div class="field"><label for="newPartnerName">Name</label><input id="newPartnerName"></div><div class="field"><label for="newPartnerShare">Share %</label><input id="newPartnerShare" type="number" step="0.01" min="0"></div></div><button class="addbtn" data-act="addPartner">+ Add partner</button>`:'';
 box.innerHTML=`${secHead('Business share',btn)}<div class="lockmsg">${note}</div>${rows}${pend}<div class="hint">${total}</div>${add}<div class="hint">Renaming a partner keeps all their history. A partner who has entries can't be deleted. Removing a partner needs a 10 minute wait after you tap Remove…</div>`;
 shareSig=lockSig();
}
function tickLocks(){   // runs every second; only redraws when a lock changes state, so nobody loses what they are typing
 if(activeTab!=='settings'||!built.settings)return;
 if(lockSig()!==shareSig){renderShare();return;}
 const g=gate(LOCKS.share,SHARE_WAIT),e=$('shareLeft');
 if(e&&g.left!==undefined)e.textContent=fmtLeft(g.left);
 document.querySelectorAll('[data-rmleft]').forEach(n=>{const r=gate(LOCKS.rm[n.dataset.rmleft],REMOVE_WAIT);if(r.left!==undefined)n.textContent=fmtLeft(r.left);});
}
