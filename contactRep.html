<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="Your message has been delivered. Thanks for reaching out to Munan.hub.">
    <meta name="author" content="Abdullah All Munan">
    <meta name="theme-color" content="#0B7A50">
    <title>Message sent | Munan.hub</title>
    <link rel="canonical" href="https://abamunan.github.io/contactRep.html">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="theme.js"></script>
    <script src="owner.js"></script>
    <link rel="stylesheet" href="site.css?v=3">
    <style>
        .rep-wrap { min-height:calc(100vh - 160px); display:flex; align-items:center; justify-content:center; padding:calc(var(--nav-h) + 40px) 0 0; }
        .rep-card { max-width:560px; margin:0 auto; text-align:center; padding:44px 32px 36px; border-radius:var(--r-panel); }
        .rep-card .tile-lg { display:flex; margin-left:auto; margin-right:auto; width:84px; height:84px; border-radius:24px; font-size:2.1rem; background:var(--marker); color:#11221D; box-shadow:5px 5px 0 var(--ink); margin-bottom:26px; }
        .rep-card .kicker { justify-content:center; }
        .rep-card h1 { font-family:var(--display); font-weight:800; font-size:clamp(1.9rem,5vw,2.6rem); letter-spacing:-.03em; line-height:1.08; margin-bottom:14px; }
        .rep-card p { color:var(--muted); max-width:30em; margin:0 auto; }
        .rep-card p strong { color:var(--ink); }
        .rep-next { display:flex; align-items:center; gap:14px; margin:28px 0 20px; color:var(--soft); font-size:.8rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
        .rep-next::before, .rep-next::after { content:''; flex:1; height:1px; background:var(--line); }
        .rep-actions { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; }
        @media (max-width:480px) { .rep-card { padding:34px 20px 28px; } .rep-actions .btn-solid, .rep-actions .btn-line { width:100%; } }
    </style>
</head>
<body class="v2">
    <a class="skip" href="#main">Skip to content</a>
    <main id="main" class="rep-wrap">
        <div class="wrap" style="width:100%;">
            <div class="panel rep-card">
                <span class="tile-lg" aria-hidden="true"><i class="fas fa-check"></i></span>
                <span class="kicker">Message delivered</span>
                <h1>Your message is on its way</h1>
                <p>Thanks for reaching out! I've received your message and will get back to you as soon as possible — usually within <strong>24 hours</strong>.</p>
                <div class="rep-next">What's next?</div>
                <div class="rep-actions">
                    <a href="index.html" class="btn-solid"><i class="fas fa-home" aria-hidden="true"></i> Back to Home</a>
                    <a href="contact.html" class="btn-line"><i class="fas fa-paper-plane" aria-hidden="true"></i> Send another</a>
                </div>
            </div>
        </div>
    </main>
    <script src="nav.js"></script>
    <script src="footer.js"></script>
</body>
</html>
