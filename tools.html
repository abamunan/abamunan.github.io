    <script>
/* ── RENDER ENGINE — no need to edit ─────────────── */
const grid      = document.getElementById('grid');
const input     = document.getElementById('q');
const cnt       = document.getElementById('cnt');
const filtersEl = document.getElementById('filters');
let activeFilter = 'all';

/* Group titles and icons per tag (unknown tags fall back to the tag name) */
const GROUPS = {
  Dev:          { label: 'Software &amp; builders', icon: 'fa-solid fa-code' },
  AI:           { label: 'AI tools',            icon: 'fa-solid fa-wand-magic-sparkles' },
  Extension:    { label: 'Browser extensions',  icon: 'fa-solid fa-puzzle-piece' },
  Productivity: { label: 'Productivity',        icon: 'fa-solid fa-list-check' },
  Social:       { label: 'Social',              icon: 'fa-solid fa-comments' },
  Media:        { label: 'Media',               icon: 'fa-solid fa-play' }
};

/* Count per tag */
const tagCounts = MY_TOOLS.reduce((acc, t) => {
  acc[t.tag] = (acc[t.tag] || 0) + 1; return acc;
}, {});

/* Build filter chips with counts */
function buildFilters() {
  filtersEl.innerHTML = '';
  ['All', ...new Set(MY_TOOLS.map(t => t.tag))].forEach((tag) => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'fchip';
    const key = tag === 'All' ? 'all' : tag;
    chip.setAttribute('aria-pressed', key === activeFilter ? 'true' : 'false');
    const count = tag === 'All' ? MY_TOOLS.length : (tagCounts[tag] || 0);
    chip.innerHTML = tag + `<span class="n">${count}</span>`;
    chip.addEventListener('click', () => {
      activeFilter = key;
      buildFilters();
      render(input.value);
    });
    filtersEl.appendChild(chip);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function render(q) {
  q = (q || '').toLowerCase().trim();
  const list = MY_TOOLS.filter(t => {
    const matchTag = activeFilter === 'all' || t.tag === activeFilter;
    const matchQ   = !q || t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || t.tag.toLowerCase().includes(q);
    return matchTag && matchQ;
  });

  cnt.textContent = list.length + ' tool' + (list.length !== 1 ? 's' : '');
  grid.innerHTML  = '';

  if (!list.length) {
    const safeQ = escapeHtml(q || activeFilter);
    grid.innerHTML = `<div class="empty">
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      No tools found for "<strong>${safeQ}</strong>" — try a different keyword.
    </div>`;
    return;
  }

  /* group by tag, in the order tags first appear in the data */
  const order = [...new Set(MY_TOOLS.map(t => t.tag))].filter(tag => list.some(t => t.tag === tag));
  order.forEach((tag) => {
    const g = GROUPS[tag] || { label: tag, icon: 'fa-solid fa-toolbox' };
    const items = list.filter(t => t.tag === tag);
    const sec = document.createElement('section');
    sec.innerHTML = `
      <div class="group-head">
        <span class="tile"><i class="${g.icon}" aria-hidden="true"></i></span>
        <h2>${g.label}</h2>
        <span class="badge">${items.length}</span>
      </div>
      <div class="util-list"></div>
    `;
    const ul = sec.querySelector('.util-list');
    items.forEach((t) => {
      const a = document.createElement('a');
      a.className = 'util tool-row';
      a.href = t.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.setAttribute('aria-label', t.name + ' (opens in a new tab)');
      a.innerHTML = `
        <span class="tile"><i class="${t.icon}" aria-hidden="true"></i></span>
        <span class="row-body"><span class="row-title">${t.name}</span><span class="row-desc">${t.desc}</span></span>
        <span class="go"><i class="fas fa-arrow-right" aria-hidden="true"></i></span>
      `;
      ul.appendChild(a);
    });
    grid.appendChild(sec);
  });
}

input.addEventListener('input', e => render(e.target.value));
buildFilters();
render();
    </script>
