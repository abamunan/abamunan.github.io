<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Your romantic wishes have safely reached my heart.">
    <meta name="author" content="Abdullah All Munan">
    <meta name="theme-color" content="#0B7A50">
    <title>Wishes received ❤️ | Munan.hub</title>
    <link rel="canonical" href="https://abamunan.github.io/birthdaywish.html">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Hind+Siliguri:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --pink-50:#fff0f7; --pink-100:#ffd6e8; --pink-200:#ffb3d2; --pink-400:#ff4f96; --pink-500:#e91e73; --pink-700:#ad1457; --ink:#5a1736; --soft:#8a4164; }
        *,*::before,*::after { box-sizing:border-box; margin:0; }
        html { scroll-behavior:smooth; }
        body { min-height:100vh; color:var(--ink); background:radial-gradient(circle at 12% 8%,rgba(255,128,181,.2),transparent 30%),linear-gradient(180deg,var(--pink-50),var(--pink-100) 40%,var(--pink-50) 100%); font-family:"Poppins","Hind Siliguri",system-ui,sans-serif; line-height:1.6; overflow-x:hidden; }
        .wish-page { min-height:100vh; display:grid; place-items:center; padding:32px 20px; }
        .wish-card { width:min(100%,620px); padding:44px 32px 36px; border:1px solid var(--pink-200); border-radius:24px; background:rgba(255,255,255,.82); box-shadow:0 14px 36px rgba(236,64,122,.16); text-align:center; }
        .wish-heart { display:grid; place-items:center; width:84px; height:84px; margin:0 auto 26px; border-radius:24px; background:linear-gradient(135deg,var(--pink-400),var(--pink-500)); box-shadow:5px 5px 0 var(--pink-700); font-size:2.1rem; }
        .wish-kicker { display:block; color:var(--pink-700); font-size:.8rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
        .wish-card h1 { margin:14px 0; color:var(--pink-700); font-family:"Dancing Script",cursive; font-size:clamp(2.2rem,8vw,4rem); line-height:1.12; }
        .wish-card p { max-width:30em; margin:0 auto; color:var(--soft); font-size:.98rem; }
        .wish-next { display:flex; align-items:center; gap:14px; margin:28px 0 20px; color:var(--soft); font-size:.8rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
        .wish-next::before,.wish-next::after { content:""; flex:1; height:1px; background:var(--pink-200); }
        .wish-actions { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; }
        .wish-actions a { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:10px 18px; border-radius:999px; font-size:.9rem; font-weight:600; text-decoration:none; }
        .wish-primary { color:#fff; background:linear-gradient(135deg,var(--pink-400),var(--pink-500)); box-shadow:0 6px 14px rgba(236,64,122,.25); }
        .wish-secondary { color:var(--pink-700); border:1px solid var(--pink-200); background:#fff; }
        @media (max-width:480px) { .wish-card { padding:34px 20px 28px; } .wish-actions a { width:100%; } }
    </style>
</head>
<body>
    <main id="main" class="wish-page">
        <div class="wish-card">
                <span class="wish-heart" aria-hidden="true">💗</span>
                <span class="wish-kicker">Wishes received ❤️</span>
                <h1>Your wishes have safely reached my heart.</h1>
                <p>Thank you for sharing your wishes with me. I promise to do my absolute best to make them come true.</p>
                <div class="wish-next">What's next?</div>
                <div class="wish-actions">
                    <a href="birthdaywish.html" class="wish-primary">💗 Back to Our World</a>
                    <a href="birthdaywish.html#feedback" class="wish-secondary">💌 Make Another Wish</a>
                </div>
        </div>
    </main>
</body>
</html>
